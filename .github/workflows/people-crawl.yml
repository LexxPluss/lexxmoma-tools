name: People DB crawl & build

# 顧客人事データベース(people/)の定期収集とビルド(SPEC §4 スケジュール)。
# 必要な Secrets: EDINET_API_KEY(有報取得)、PEOPLE_PW(暗号化の共通パスワード。工場マップと同じなら FACTORY_PW を流用)
# 更新は PR で出す: リポジトリ設定 Actions > General で「Allow GitHub Actions to create and approve pull requests」を有効にする
# 収集原本(raw/)は Actions の artifact に残し、リポジトリにはコミットしない。
on:
  schedule:
    - cron: "0 21 * * *"      # 毎日 06:00 JST: TDnet 新着
    - cron: "0 20 * * 0"      # 毎週月曜 05:00 JST: 会社サイト diff
    - cron: "0 22 1 * *"      # 毎月 1 日 07:00 JST: EDINET 有報(通常月)
    - cron: "0 22 20-30 6 *"  # 6/20〜7/10 は毎日: 有報の提出集中期
    - cron: "0 22 1-10 7 *"
  push:
    branches: [main]
    paths:
      - "people/manual/**"
      - "people/crawler/**"
  workflow_dispatch:
    inputs:
      steps:
        description: "実行するステップ(カンマ区切り: registry,edinet,tdnet,sites,build)"
        default: "registry,tdnet,sites,build"

permissions:
  contents: write        # 更新用ブランチへの push
  pull-requests: write   # 更新 PR の作成(main へは直接コミットしない)

concurrency:
  group: people-db
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      PEOPLE_PW: ${{ secrets.PEOPLE_PW }}
      FACTORY_PW: ${{ secrets.FACTORY_PW }}
      PEOPLE_CONTACT: ${{ vars.PEOPLE_CONTACT || 'https://lexxpluss.com/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: people/crawler/requirements.txt

      - run: pip install -r people/crawler/requirements.txt

      # 前回までの収集原本(スナップショット diff に必要)を復元
      - uses: actions/download-artifact@v4
        with:
          name: people-raw
          path: people/raw
        continue-on-error: true

      - name: Decide steps
        id: steps
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then s="${{ github.event.inputs.steps }}";
          elif [ "${{ github.event_name }}" = "push" ]; then s="registry,build";
          elif [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then s="registry,tdnet,build";
          elif [ "${{ github.event.schedule }}" = "0 20 * * 0" ]; then s="registry,sites,build";
          else s="registry,edinet,build"; fi
          echo "steps=$s" >> "$GITHUB_OUTPUT"

      - name: Registry
        if: contains(steps.steps.outputs.steps, 'registry')
        run: python people/crawler/registry.py

      - name: EDINET
        if: contains(steps.steps.outputs.steps, 'edinet')
        run: python people/crawler/crawl_edinet.py --from "$(date -d '35 days ago' +%F)" --to "$(date +%F)"

      - name: TDnet
        if: contains(steps.steps.outputs.steps, 'tdnet')
        run: python people/crawler/crawl_tdnet.py --days 2

      - name: Company sites
        if: contains(steps.steps.outputs.steps, 'sites')
        run: python people/crawler/crawl_sites.py

      - name: Tests
        run: python -m unittest discover -s people/tests

      - name: Build (encrypt)
        if: contains(steps.steps.outputs.steps, 'build')
        run: python people/crawler/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: people-raw
          path: people/raw
          retention-days: 90
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: people-logs
          path: people/logs
          retention-days: 30
          if-no-files-found: ignore

      # 暗号化データだけを更新用ブランチにコミットし、PR を作る(平文 data/ と raw/ は .gitignore)。
      # main には直接コミットしない。同じブランチの PR が開いていれば、そこに追加で push するだけ
      - name: Open PR with encrypted data
        if: contains(steps.steps.outputs.steps, 'build')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=people-db/data-update
          git config user.name "people-db-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/members/people-db/data.enc.json site/members/people-db/data.enc.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git checkout -B "$BRANCH"
          git commit -m "people-db: update data ($(date +%F))"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "people-db: update data ($(date +%F))" --body "顧客人事データベースの定期収集で暗号化データ(site/members/people-db/data.enc.*)を更新しました。実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}。データ品質はアーティファクト people-logs と画面の「データ品質」タブで確認してください。"
          fi
