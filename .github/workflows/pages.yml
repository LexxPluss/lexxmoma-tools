name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fail the deploy if any internal-only folder slipped into site/
      - name: Check for internal-only files
        run: |
          bad=$(find site \( -name internal -o -name safety-navi -o -iname crx-eoat-tool -o -name .claude \
                 -o -path 'site/robot-sier-map/scripts' -o -path 'site/robot-sier-map/data/raw' \) -print)
          if [ -n "$bad" ]; then echo "Internal-only files found:"; echo "$bad"; exit 1; fi
          # エンドエフェクタ事例DB(2026-11 から社外公開): 原本・作業データ・ログは eoat/ の下(公開外)。公開側の画像は縮小版だけ
          # (一覧用パック img/thumb/*.bin と詳細用 img/detail/*.webp。元のサイズの画像などほかの形式が混ざっていたら止める)
          bad=$(find eoat/raw eoat/data eoat/logs -type f 2>/dev/null; find site/eoat-db/img -type f ! -path '*/thumb/*.bin' ! -path '*/detail/*.webp' 2>/dev/null)
          if [ -n "$bad" ]; then echo "eoat: raw data or unexpected images found:"; echo "$bad"; exit 1; fi

      # ROI Calculator and Process Sketch are published from dist/; make sure it was rebuilt from src/
      - name: Check built tools are up to date
        run: |
          (cd site/lexxmoma-roi && python3 build.py)
          (cd site/process-sketch && python3 build.py)
          (cd site/simulator && python3 build.py)
          git diff --exit-code -- site/lexxmoma-roi/dist site/process-sketch/dist \
            site/simulator/vendor/three.bundle.js site/simulator/meshes/crx20ia_l.js site/simulator/samples/embedded.js \
            || { echo "dist/ is out of date: run python3 build.py and commit the result"; exit 1; }

      - name: Run tool tests
        run: |
          node site/lexxmoma-roi/test/calc.test.js
          node site/process-sketch/test/continuity.test.cjs
          node --test site/eoat-db/test/ui.test.cjs
          node --test site/simulator/test/kinematics.test.cjs

      # Publish only what the pages need: sources, build scripts, tests and dev notes stay in the repo
      - name: Package site
        run: |
          rsync -a --delete \
            --exclude 'src/' --exclude 'test/' --exclude 'build.py' --exclude 'build.js' \
            --exclude '*.md' --exclude '*.gs' --exclude 'library/tools/' \
            site/ _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
