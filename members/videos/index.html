<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>共有動画 | LexxPluss 社内</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<script src="../../assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- 入口(パスワードは社内ツールの入口 members/index.html で入れる。未入力ならそこへ移動) -->
<div class="gate" id="gate">
  <button type="button" class="lx-theme-btn" data-lx-theme-toggle aria-label="ライト / ダーク切替"></button>
  <div class="gate-card">
    <a class="gate-home" href="../index.html" title="社内ツールのトップへ"><img class="lx-logo" src="../../assets/lexxpluss-logo.png" alt="LexxPluss"></a>
    <h1>共有動画</h1>
    <p id="gateMsg" role="status">開いています…</p>
    <p class="gate-note">LexxPluss 社内メンバー向けのツールです。パスワードは<a href="../index.html">社内ツールの入口</a>で入れます。</p>
    <a class="gate-back" href="../../index.html">LexxMoMa Tools に戻る</a>
  </div>
</div>

<div class="app" id="app" hidden>
  <div class="banner" role="note">社内限定 — 限定公開の動画を含みます。URL を社外に転送しないでください。</div>
  <header class="hdr">
    <div class="hdr-title">
      <a href="../index.html" title="社内ツールのトップへ"><img class="lx-logo" src="../../assets/lexxpluss-logo.png" alt="LexxPluss"></a>
      <h1>共有動画</h1><a class="tag" href="../index.html" title="社内ツールのトップへ">社内</a>
    </div>
    <span class="hdr-btns">
      <a class="icon-btn link" href="../factory-map/index.html" title="工場マップへ">🏭</a>
      <a class="icon-btn link" href="../people-db/index.html" title="顧客人事データベースへ">👥</a>
      <button type="button" class="lx-theme-btn" data-lx-theme-toggle aria-label="ライト / ダーク切替"></button>
      <button class="icon-btn" id="lock" type="button" title="ロックする(社内ツールすべてのパスワードを忘れさせる)">🔒</button>
    </span>
  </header>

  <main class="main">
    <!-- 再生中の動画(一覧のカードを押すとここで再生) -->
    <section class="stage" id="stage" hidden>
      <div class="player"><iframe id="player" title="動画プレーヤー" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
      <div class="now">
        <h2 id="nowTitle"></h2>
        <p class="muted" id="nowMeta"></p>
        <p id="nowDesc"></p>
        <p class="now-links"><a id="nowYt" target="_blank" rel="noopener">YouTube で開く ↗</a><button type="button" class="link-btn" id="copyLink">この動画へのリンクをコピー</button></p>
      </div>
    </section>

    <div class="toolbar">
      <input type="search" id="q" placeholder="タイトル・説明で検索">
    </div>
    <div class="chips" id="catChips" role="group" aria-label="カテゴリで絞り込み"></div>
    <div class="res" id="res"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <span class="ic">🎬</span>
      <b>動画はまだ登録されていません</b>
      <p>共有したい YouTube の URL が決まったら、ここに一覧で並びます。</p>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script src="../../assets/track.js" data-tool="videos"></script>
<script src="data.enc.js?v=2"></script>
<script src="../members-auth.js?v=3"></script>
<script src="app.js?v=2"></script>
</body>
</html>
