# 検索の評価セット(7-2)。q を UI と同じ分解・検索にかけ、上位 12 件が expect(いずれかを満たす)に合う割合 = precision@12、
# 傾向パネルの最多の掴み方(principle_group)が trend に一致する割合 = trend_accuracy。
