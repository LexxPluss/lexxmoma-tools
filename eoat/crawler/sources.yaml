    lang: en
    index_urls: ["https://onrobot.com/en/case-studies"]
    paginate: "https://onrobot.com/en/case-studies?page={n}"
    max_pages: 8
    article: "^https://onrobot\\.com/en/case-studies/[^/?#]+$"
    render: true     # 本文と画像を JS で組み立てるので、Chromium で描画してから取る
    status: ok
