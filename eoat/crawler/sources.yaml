    checked: 2026-10-28
    note: "修正版: paginate を外す。?page=1,2,7,8 はどれも 1 ページ目と同じ 23 件を返す(page を見ていない)。sitemap.xml の /en/case-studies/ も同じ 23 件なので、英語の事例はこれで全部。1 ページ目の素の HTML に 23 件そろう(例 /35-cost-savings-at-yokoyama, /wefag-cnc-machine-tending-3fg15, /packaging-delicate-herbs-with-rg6)。他言語に事例ページは無い。render: true は個別ページ用で、そのまま残す"
