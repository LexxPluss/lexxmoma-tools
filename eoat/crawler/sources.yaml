# 取得元の一覧。discover.py が index_urls を巡回し、article(正規表現) に合う URL を候補にする。
# type: maker_gripper(ハンド・吸着メーカー) / maker_robot(ロボットメーカー) / sier(SIer・装置メーカー) / public(公的・協会) / media(業界メディア) / custom(ユーザー・研究・オープンソース)
# case_type: 事例の種別(3-2 スキーマ)。region/country: 取得元の地域(事例の地域は本文で上書きすることがある)
# image: stored(既定) / link_only(規約で画像利用を禁じているサイト。manual/image_policy.json と同じ意味)
# status: ok / blocked(403・Cloudflare など) / todo(未調査)。調査日は checked。
sources:
