    case_type: maker_product
    region: 北米
    country: カナダ
    lang: en
    index_urls: ["https://robotiq.com/resource-center?type_of_resources=Case+Studies"]
    article: "^https://robotiq\\.com/resource-center/case-studies/[^/?#]+$"
    status: ok
    checked: 2026-10-28
    note: "修正版: paginate を外す。&page=6 / &page=7 は 1 ページ目と同じ 35 件を返す(page を見ていない)。sitemap.xml の英語版の事例も 35 件なので、1 ページ目で全部(例 /ajinomoto, /sennheiser, /walt-machine)。/ja/ には同じ事例の訳 30 件、/ko/ に 1 件(/ko/resource-center/case-studies/korea-filter-engineering)"
