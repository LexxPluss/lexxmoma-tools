<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>LexxMoMa 費用対効果（ROI）計算ツール</title>
<!-- 共通テーマ(light/dark)。サイト外で単体配布したときは読めずに light のまま動く。ビルドでもインライン化しない -->
<script src="../../assets/theme.js"></script>
<style>
/* LexxMoMa 費用対効果 簡易計算ツール — styles.css */
:root {
  --primary: #0068B7;
  --primary-light: #E6F0F9;
  --accent: #3EB370;
  --accent-light: #E8F6EE;
  --yellow: #F2B705;
  --grey: #9AA0A6;
  --text: #1F2933;
  --muted: #5F6B7A;
  --border: #D9DEE3;
  --bg: #FFFFFF;
  --bg-soft: #F5F7FA;
  --warn: #D93025;
  --radius: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-width: 1024px;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 700; }

/* ---------- ヘッダー ---------- */
.hdr {
  display: flex; align-items: center; gap: 20px;
  padding: 12px 24px;
  border-bottom: 3px solid var(--primary);
  background: var(--bg);
}
.hdr .brand { display: flex; align-items: baseline; gap: 10px; }
/* LexxMoMa Tools 共通ヘッダー(.lx-hdr / .lx-wordmark / .lx-tool, ../../assets/theme.js)と同じ値。theme.js が無い単体表示でも同じ見た目にする */
.hdr .brand .logo, .hdr .brand h1 { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif; }
.hdr .brand .logo { color: var(--primary); font-weight: 800; font-size: 20px; letter-spacing: .02em; }
.hdr .brand h1 { font-size: 16px; font-weight: 600; }
.hdr .spacer { flex: 1; }
.mode-toggle { display: inline-flex; border: 1px solid var(--primary); border-radius: 999px; overflow: hidden; }
.mode-toggle button { background: #fff; border: 0; padding: 6px 18px; color: var(--primary); font-weight: 600; }
.mode-toggle button.on { background: var(--primary); color: #fff; }
.scn { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.scn input { width: 200px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- レイアウト ---------- */
.grid {
  display: grid; grid-template-columns: var(--inputs-w, 470px) 10px 1fr; gap: 0 8px;
  padding: 18px 24px 8px;
  align-items: start;
}
.splitter {
  align-self: stretch; cursor: col-resize; border-radius: 5px; position: relative;
  background: transparent;
}
.splitter::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--border); }
.splitter:hover::before, .splitter.drag::before { background: var(--primary); }
.corp-logo { height: 28px; width: auto; display: block; box-sizing: content-box; padding: 3px 6px; border-radius: 6px; background: #fff; } /* assets/theme.js の .lx-logo と同じ見た目(単体配布でも同じ) */
.hdr .brand { align-items: center; }
.panel {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px;
}
/* 入力パネルは画面内に固定し、内側で独立スクロール */
.panel.inputs { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; }
.panel.inputs > h2 { position: sticky; top: 0; background: var(--bg); z-index: 1; margin-top: -4px; padding-top: 4px; }
.panel > h2 { font-size: 14px; color: var(--primary); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

/* ---------- 入力 ---------- */
.field { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.field:last-child { border-bottom: 0; }
.field > label { font-weight: 600; font-size: 13px; }
.field .ctl { display: flex; align-items: center; gap: 8px; }
.field .ctl input[type="range"] { flex: 1; accent-color: var(--primary); }
.field .ctl input[type="number"], .field .ctl input[type="text"] {
  width: 110px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; text-align: right;
  background: #fff;
}
.field .ctl input[data-path="base.opexAnnual"] { width: 160px; }
.field .ctl input.warn { border-color: var(--warn); background: #FDECEA; }
.field .ctl .unit { color: var(--muted); min-width: 44px; font-size: 12px; }
.field .hint { color: var(--muted); font-size: 12px; }
.btn-group { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.btn-group button { border: 0; background: #fff; padding: 6px 16px; border-right: 1px solid var(--border); }
.btn-group button:last-child { border-right: 0; }
.btn-group button.on { background: var(--primary); color: #fff; }

.group { border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; padding: 6px 12px 8px; background: var(--bg-soft); }
.group > legend { font-weight: 700; font-size: 13px; color: var(--primary); padding: 0 6px; background: #fff; border-radius: 4px; }
.group .field { padding: 5px 0; border-bottom: 0; }
.group .field > label { font-weight: 500; }
.group .row { display: grid; grid-template-columns: 1fr 160px 60px; align-items: center; gap: 8px; padding: 4px 0; }
.group .row label { font-size: 13px; }
.group .row input { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; text-align: right; background: #fff; }
.group .row input.warn { border-color: var(--warn); background: #FDECEA; }
.group .row .unit { color: var(--muted); font-size: 12px; }
.group .total { display: grid; grid-template-columns: 1fr 160px 60px; align-items: center; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); font-weight: 700; }
.group .total .val { text-align: right; color: var(--primary); font-size: 15px; }
.group .total input { width: 100%; padding: 5px 8px; border: 1px solid var(--primary); border-radius: 6px; text-align: right; font-weight: 700; color: var(--primary); background: #fff; }
.group .total input.derived { border-color: var(--border); color: var(--text); background: #F0F2F5; }
.group .total .unit { color: var(--muted); font-size: 12px; font-weight: 400; }
.group .note { grid-column: 1 / -1; color: var(--muted); font-size: 11px; font-weight: 400; }
.group .ref { color: var(--muted); font-size: 12px; margin-top: 4px; }
.check { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.check input { accent-color: var(--primary); width: 16px; height: 16px; }

/* ---------- 結果 ---------- */
.results { display: grid; grid-template-columns: 300px 1fr; grid-auto-rows: max-content; align-content: start; gap: 14px 18px; }
.results h2 { grid-column: 1 / -1; }
.kpi-main { grid-column: 1; }
.kpi-side { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
.chart-wrap { grid-column: 1 / -1; }
.compare-wrap { grid-column: 1 / -1; }

.gauge { text-align: center; }
.gauge svg { width: 100%; height: auto; display: block; }
.gauge .big { font-size: 40px; font-weight: 800; line-height: 1; color: var(--text); }
.gauge .big small { font-size: 18px; font-weight: 600; margin-left: 4px; }
.gauge .status { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1.5em; }
.gauge .legend { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.gauge .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 190px; border: 2px dashed var(--border); border-radius: var(--radius); color: var(--muted); text-align: center; padding: 16px;
}
.placeholder b { color: var(--primary); font-size: 16px; }
.placeholder .tip { font-size: 12px; margin-top: 8px; }

.kpi { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--bg-soft); }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1.2; }
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.kpi.accent .v { color: var(--accent); }
.kpi.neg .v { color: var(--warn); }
.kpi.muted .v { color: var(--text); }

.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.chart-title .legend { display: flex; gap: 12px; font-size: 11px; font-weight: 400; color: var(--muted); }
.chart-title .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

.compare-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.compare-head h3 { font-size: 13px; flex: 1; }
.btn { border: 1px solid var(--primary); background: #fff; color: var(--primary); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.btn:hover { background: var(--primary-light); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: #005596; }
.btn.accent { border-color: var(--accent); color: var(--accent); }
.btn.accent:hover { background: var(--accent-light); }
.btn.ghost { border-color: var(--border); color: var(--muted); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
table.compare { width: 100%; border-collapse: collapse; font-size: 13px; }
table.compare th, table.compare td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; }
table.compare th { background: var(--bg-soft); font-weight: 600; }
table.compare th:first-child, table.compare td:first-child { text-align: left; }
table.compare th.a { color: var(--primary); }
table.compare th.b { color: var(--accent); }
table.compare tr.hl td { font-weight: 700; }
table.compare .empty { color: var(--muted); font-weight: 400; }

/* ---------- 工場タイクーン 3D（結果パネル最上段） ---------- */
.factory-wrap { grid-column: 1 / -1; }
.scene-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
.scene-bar .btn-group button { padding: 5px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.scene-bar .btn { white-space: nowrap; }
.scene-hint { white-space: nowrap; }
.scene-bar .btn-group button[data-view="before"].on { background: var(--grey); }
.scene-bar .btn-group button[data-view="after"].on { background: var(--accent); }
.scene-bar .btn-group button:disabled { color: #B9C6D2; cursor: not-allowed; }
.scene-hint { color: var(--muted); }
.scene-caption { margin-left: auto; font-weight: 700; color: var(--text); }
.factory { position: relative; }
.scene-events { position: absolute; right: 12px; top: 52px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.ev-btn { border: 1px solid var(--border); background: rgba(255,255,255,.94); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); white-space: nowrap; }
.ev-btn:hover { border-color: var(--primary); color: var(--primary); }
.ev-btn:disabled { opacity: .45; cursor: not-allowed; }
.ev-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }
.ev-count { font-size: 10.5px; color: var(--muted); background: rgba(255,255,255,.85); border-radius: 999px; padding: 2px 8px; }
.factory canvas { display: block; width: 100%; height: 320px; border-radius: var(--radius); border: 1px solid var(--border); cursor: grab; touch-action: none; user-select: none; background: #F1F5F9; }
.factory canvas.drag { cursor: grabbing; }

/* 初期投資：単価 × 数量 */
.group .row.capex { grid-template-columns: 1fr 120px 14px 58px 34px 84px; }
.group .row.capex .x { text-align: center; color: var(--muted); }
.group .row.capex input.qty { text-align: center; }
.group .row.capex .amt { text-align: right; font-weight: 600; color: var(--text); font-size: 12.5px; white-space: nowrap; }
.group .row.capex .amt small { color: var(--muted); font-weight: 400; }
.group .capex-head { display: grid; grid-template-columns: 1fr 120px 14px 58px 34px 84px; gap: 8px; font-size: 10.5px; color: var(--muted); padding: 0 0 2px; }
.group .capex-head span:nth-child(2) { text-align: right; }
.group .capex-head span:nth-child(4) { text-align: center; }
.group .capex-head span:last-child { text-align: right; }

/* ---------- アクション ---------- */
.actions { display: flex; gap: 10px; padding: 8px 24px 16px; align-items: center; }
.actions .btn { padding: 8px 16px; }
.toast {
  position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: .95; }

/* ---------- フッター ---------- */
footer {
  padding: 10px 24px 18px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between;
}

/* ---------- ダイアログ ---------- */
dialog { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; min-width: 360px; }
dialog::backdrop { background: rgba(31,41,51,.35); }
dialog h3 { font-size: 15px; color: var(--primary); margin-bottom: 10px; }
dialog .row { display: grid; grid-template-columns: 1fr 90px 40px; gap: 8px; align-items: center; padding: 6px 0; }
dialog .row input { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; text-align: right; }
dialog .row i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
dialog p { color: var(--muted); font-size: 12px; margin: 0 0 8px; }

/* ---------- 印刷用入力サマリー ---------- */
.print-summary { display: none; }

/* ---------- 印刷 ---------- */
@media print {
  @page { size: A4 portrait; margin: 10mm 12mm; }
  html, body { min-width: 0; width: auto; font-size: 10.5px; }
  .hdr { padding: 4px 0 6px; border-bottom-width: 2px; }
  .hdr .mode-toggle, .hdr .icon-btn, .hdr .scn input { display: none; }
  .hdr .scn::after { content: attr(data-print); font-weight: 600; color: var(--text); }
  .actions, .toast, dialog, .inputs, .splitter, .compare-head .btn, .no-print { display: none !important; }
  .corp-logo { height: 22px; }
  .grid { display: block; padding: 6px 0 0; }
  .panel { border: 0; padding: 0; }
  .print-summary { display: block; grid-column: 1 / -1; margin-bottom: 6px; }
  .print-summary h2 { font-size: 11px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 2px; margin-bottom: 4px; }
  .print-summary table { width: 100%; border-collapse: collapse; font-size: 9.5px; }
  .print-summary td { padding: 1px 6px; border-bottom: 1px dotted var(--border); }
  .print-summary td.v { text-align: right; white-space: nowrap; }
  .print-summary .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; align-items: start; }
  .print-summary .cols.three { grid-template-columns: 1fr 1fr 1fr; }
  .results { grid-template-columns: 220px 1fr; gap: 6px 12px; }
  .results > h2 { font-size: 11px; margin-bottom: 2px; }
  .gauge .big { font-size: 26px; }
  .gauge .big small { font-size: 13px; }
  .gauge .status, .gauge .legend { font-size: 9px; }
  .kpi { padding: 5px 8px; }
  .kpi .v { font-size: 15px; }
  .kpi .k, .kpi .sub { font-size: 9px; }
  .chart-wrap svg { max-height: 62mm; }
  table.compare { font-size: 9.5px; }
  table.compare th, table.compare td { padding: 2px 6px; }
  footer { padding: 4px 0; font-size: 9px; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- テーマ（light / dark）: サイト共通の assets/theme.js が <html data-theme> を設定 ---------- */
.corp-link { display: flex; align-items: center; gap: 18px; color: inherit; text-decoration: none; border-radius: 6px; } /* ロゴ + LexxMoMa をまとめてトップへのリンクに(.lx-brand と同じ) */
.corp-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.lx-theme-btn:empty { display: none; } /* theme.js が無い単体配布時はボタンを出さない */
.hdr .lx-theme-btn { --lx-theme-btn: 34px; border-radius: 50%; border-color: var(--border); color: var(--muted); }

/* dark は画面表示のみ。印刷（A4）は常に light（ui.js が beforeprint でも light に戻して再描画） */
@media screen {
  :root[data-theme="dark"] {
    --primary: #5aa8e6;
    --primary-light: #12314a;
    --accent: #5fcb8a;
    --accent-light: #14352a;
    --yellow: #F2B705;
    --grey: #7d8a96;
    --text: #e7edf2;
    --muted: #a3b1bd;
    --border: #2b3741;
    --bg: #0f1519;
    --bg-soft: #171f26;
    --warn: #ff7a6e;
    --panel-2: #1e2831;
    --on-primary: #0f1519;
    --chart-track: #26323c;
    color-scheme: dark;
  }
  :root[data-theme="dark"] .panel { background: var(--bg-soft); }
  :root[data-theme="dark"] .panel.inputs > h2 { background: var(--bg-soft); }
  :root[data-theme="dark"] .group { background: var(--bg); }
  :root[data-theme="dark"] .kpi, :root[data-theme="dark"] table.compare th { background: var(--panel-2); }
  /* 白地だった入力・ボタン類 */
  :root[data-theme="dark"] .mode-toggle button,
  :root[data-theme="dark"] .icon-btn,
  :root[data-theme="dark"] .btn-group button,
  :root[data-theme="dark"] .btn,
  :root[data-theme="dark"] .group > legend,
  :root[data-theme="dark"] .field .ctl input[type="number"],
  :root[data-theme="dark"] .field .ctl input[type="text"],
  :root[data-theme="dark"] .group .row input,
  :root[data-theme="dark"] .group .total input,
  :root[data-theme="dark"] .scn input,
  :root[data-theme="dark"] dialog,
  :root[data-theme="dark"] dialog .row input { background: var(--panel-2); color: var(--text); }
  :root[data-theme="dark"] .mode-toggle button,
  :root[data-theme="dark"] .btn { color: var(--primary); }
  :root[data-theme="dark"] .btn.accent { color: var(--accent); }
  :root[data-theme="dark"] .btn.ghost { color: var(--muted); }
  :root[data-theme="dark"] .group .total input { color: var(--primary); }
  :root[data-theme="dark"] .group .total input.derived { background: var(--bg); color: var(--text); }
  :root[data-theme="dark"] .field .ctl input.warn,
  :root[data-theme="dark"] .group .row input.warn { background: #3a1d1a; }
  /* 塗りの主ボタン: 明るい青の上は暗い文字 */
  :root[data-theme="dark"] .mode-toggle button.on,
  :root[data-theme="dark"] .btn-group button.on,
  :root[data-theme="dark"] .btn.primary { background: var(--primary); color: var(--on-primary); }
  :root[data-theme="dark"] .btn.primary:hover { background: #8cc4f0; }
  :root[data-theme="dark"] .btn:hover { background: var(--primary-light); }
  :root[data-theme="dark"] .btn.accent:hover { background: var(--accent-light); }
  :root[data-theme="dark"] .scene-bar .btn-group button[data-view="before"].on { background: var(--grey); color: var(--on-primary); }
  :root[data-theme="dark"] .scene-bar .btn-group button[data-view="after"].on { background: var(--accent); color: var(--on-primary); }
  :root[data-theme="dark"] .scene-bar .btn-group button:disabled { color: #56636f; }
  /* 3D の工場シーンは絵として light のまま。上に重なるボタンだけ暗色に */
  :root[data-theme="dark"] .ev-btn { background: rgba(23,31,38,.94); }
  :root[data-theme="dark"] .ev-btn.active { background: var(--warn); color: var(--on-primary); }
  :root[data-theme="dark"] .ev-count { background: rgba(23,31,38,.85); }
  :root[data-theme="dark"] .toast { background: var(--text); color: var(--bg); }
  :root[data-theme="dark"] dialog::backdrop { background: rgba(0,0,0,.55); }
}

</style>
</head>
<body>

<script>
/* LexxMoMa 費用対効果 簡易計算ツール — calc.js
 * 計算ロジック（純関数のみ・DOM非依存）。ブラウザでは globalThis.LXCALC、Node では module.exports。
 * 通貨単位はすべて万円。 */
(function (root, factory) {
  'use strict';
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.LXCALC = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // ---------- 入力の正規化 ----------
  function isBlank(v) { return v === null || v === undefined || v === ''; }
  function toNumber(v) {
    if (typeof v === 'number') return v;
    if (isBlank(v)) return NaN;
    return Number(String(v).replace(/,/g, '').trim());
  }
  /** 負値・NaN・空欄は 0 扱い */
  function num(v) {
    const n = toNumber(v);
    if (!Number.isFinite(n) || n < 0) return 0;
    return n;
  }
  /** 警告表示用：空欄以外で数値として不正（NaN・負値）なら true */
  function isInvalid(v) {
    if (isBlank(v)) return false;
    const n = toNumber(v);
    return !Number.isFinite(n) || n < 0;
  }
  function normalizeShifts(s) { const n = Math.round(num(s)); return Math.min(3, Math.max(1, n || 1)); }
  function normalizeYears(y) { const n = Math.round(num(y)); return n >= 1 ? n : 5; }

  // ---------- 状態の既定値 ----------
  const DEFAULT_STATE = {
    v: 1,
    mode: 'light',                 // 'light' | 'detail'
    scenarioName: '',
    base: {                        // 両モード共通の入力（ライトモードの7項目）
      laborCostPerPerson: 600,
      shifts: 2,
      personsPerShift: 1,
      wageGrowth: 3,
      capex: { robot: '', camera: '', endEffector: '', integration: '' },          // 単価（万円）
      capexQty: { robot: 1, camera: 1, endEffector: 1, integration: 1 },          // 数量（台・個・式）
      opexAnnual: '',
      years: 5
    },
    detail: {                      // 精緻モードの展開項目
      wage: { base: 450, overheadRate: 30, overtimeHours: 0, overtimeRate: 0, hiringTraining: 0 },
      ops: { workingDays: 240, hoursPerShift: 8, stationsPerRobot: 1, availability: 95 },
      capex: { si: '', safety: '', layout: '', training: '', spares: '' },        // 単価（万円）
      capexQty: { si: 1, safety: 1, layout: 1, training: 1, spares: 1 },         // 数量（式）
      opex: { maintenance: '', software: '', power: '', consumables: '' },
      extra: { qualitySaving: 0, downtimeSaving: 0 },
      fin: { enableNPV: false, discountRate: 5, depreciationYears: 7 },
      // 合計欄の直接入力値（null なら展開項目から自動算出）
      override: { labor: null, integration: null, opex: null }
    },
    thresholds: { green: 2.0, yellow: 3.0 },
    scenarios: { A: null, B: null },
    ui: { inputWidth: 470 }                    // 画面レイアウト（入力パネル幅）
  };
  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
  function defaultState() { return deepClone(DEFAULT_STATE); }
  /** base の構造を保ちつつ patch の値を取り込む（未知キーは無視） */
  function mergeState(base, patch) {
    if (!patch || typeof patch !== 'object') return base;
    for (const k of Object.keys(base)) {
      if (!(k in patch)) continue;
      const bv = base[k], pv = patch[k];
      if (k === 'scenarios' || k === 'override') { base[k] = Object.assign({}, bv, pv || {}); continue; }
      if (bv && typeof bv === 'object' && !Array.isArray(bv)) {
        if (pv && typeof pv === 'object') mergeState(bv, pv);
      } else {
        base[k] = pv;
      }
    }
    return base;
  }

  // ---------- 精緻モードの部分計算 ----------
  function laborCostFromWage(w) {
    return num(w.base) * (1 + num(w.overheadRate) / 100)
      + num(w.overtimeHours) * num(w.overtimeRate) / 10000
      + num(w.hiringTraining);
  }
  function effectivePersonsPerShift(personsPerShift, ops) {
    return num(personsPerShift) * num(ops.stationsPerRobot) * num(ops.availability) / 100;
  }
  function sumItems(obj) { return Object.keys(obj).reduce((a, k) => a + num(obj[k]), 0); }
  /** 数量：空欄は 1 扱い（負値・NaN は 0） */
  function qty(v) { return isBlank(v) ? 1 : num(v); }
  /** 金額 = 単価 × 数量 */
  function amount(price, q) { return num(price) * qty(q); }
  /** 単価×数量の合計（qtyObj が無ければ数量1） */
  function sumAmounts(prices, qtys) { return Object.keys(prices).reduce((a, k) => a + amount(prices[k], qtys ? qtys[k] : 1), 0); }
  function allBlank(obj) { return Object.keys(obj).every(k => isBlank(obj[k])); }
  /** 参考表示：時間あたり人件費（円/h） */
  function hourlyRate(laborCostPerPerson, ops) {
    const h = num(ops.workingDays) * num(ops.hoursPerShift);
    return h > 0 ? num(laborCostPerPerson) * 10000 / h : 0;
  }

  /** 状態 → 実効パラメータ（モードに応じて合計値を解決） */
  function resolveInputs(state) {
    const b = state.base, d = state.detail;
    const light = state.mode !== 'detail';
    const derived = {
      labor: laborCostFromWage(d.wage),
      integration: sumAmounts(d.capex, d.capexQty),
      opex: sumItems(d.opex)
    };
    let labor, integration, opex, effPersons, extra = 0, discountRate = null;
    if (light) {
      labor = num(b.laborCostPerPerson);
      integration = amount(b.capex.integration, b.capexQty.integration);
      opex = num(b.opexAnnual);
      effPersons = num(b.personsPerShift);
    } else {
      labor = !isBlank(d.override.labor) ? num(d.override.labor) : derived.labor;
      integration = !isBlank(d.override.integration) ? num(d.override.integration) : derived.integration;
      opex = !isBlank(d.override.opex) ? num(d.override.opex) : derived.opex;
      effPersons = effectivePersonsPerShift(b.personsPerShift, d.ops);
      extra = num(d.extra.qualitySaving) + num(d.extra.downtimeSaving);
      if (d.fin.enableNPV) discountRate = num(d.fin.discountRate);
    }
    const capex = {
      robot: amount(b.capex.robot, b.capexQty.robot), camera: amount(b.capex.camera, b.capexQty.camera),
      endEffector: amount(b.capex.endEffector, b.capexQty.endEffector), integration
    };
    const capexQty = {
      robot: qty(b.capexQty.robot), camera: qty(b.capexQty.camera),
      endEffector: qty(b.capexQty.endEffector), integration: qty(b.capexQty.integration)
    };
    return {
      mode: light ? 'light' : 'detail',
      capexQty,
      robotUnits: Math.max(1, Math.round(capexQty.robot) || 1),
      laborCostPerPerson: labor,
      shifts: normalizeShifts(b.shifts),
      personsPerShift: num(b.personsPerShift),
      effectivePersonsPerShift: effPersons,
      wageGrowth: num(b.wageGrowth),
      capex,
      capexTotal: capex.robot + capex.camera + capex.endEffector + capex.integration,
      opexAnnual: opex,
      years: normalizeYears(b.years),
      extraAnnual: extra,
      discountRate,
      derived,
      hourlyRate: light ? null : hourlyRate(labor, d.ops)
    };
  }

  // ---------- 本体計算 ----------
  /**
   * @param p { laborCostPerPerson, shifts, personsPerShift | effectivePersonsPerShift,
   *            wageGrowth(%), capex{...} | capexTotal, opexAnnual, years, extraAnnual?, discountRate?(%)|null }
   */
  function compute(p) {
    const shifts = normalizeShifts(p.shifts);
    const years = normalizeYears(p.years);
    const labor = num(p.laborCostPerPerson);
    const persons = !isBlank(p.effectivePersonsPerShift) ? num(p.effectivePersonsPerShift) : num(p.personsPerShift);
    const g = num(p.wageGrowth) / 100;
    const opex = num(p.opexAnnual);
    const extra = num(p.extraAnnual);
    const capexTotal = !isBlank(p.capexTotal) ? num(p.capexTotal) : sumItems(p.capex || {});

    const annualSaving0 = labor * shifts * persons;
    const series = [{ year: 0, saving: 0, opex: 0, net: 0, cum: -capexTotal }];
    let cum = -capexTotal;
    for (let n = 1; n <= years; n++) {
      const saving = annualSaving0 * Math.pow(1 + g, n - 1) + extra;   // 付加効果は高騰率を掛けない
      const net = saving - opex;
      cum += net;
      series.push({ year: n, saving, opex, net, cum });
    }
    const out = {
      error: null, annualSaving0, extraAnnual: extra, firstYearSaving: annualSaving0 + extra,
      capexTotal, opexAnnual: opex, years, series, cumFinal: cum, paybackYears: null, npv: null
    };
    if (capexTotal <= 0) { out.error = 'NO_CAPEX'; return out; }
    out.paybackYears = paybackYears(series);
    if (!isBlank(p.discountRate)) out.npv = npv(series, num(p.discountRate));
    return out;
  }

  /** cumCF(k-1) < 0 ≤ cumCF(k) となる最小 k を線形補間。回収しなければ null */
  function paybackYears(series) {
    for (let k = 1; k < series.length; k++) {
      const a = series[k - 1].cum, b = series[k].cum;
      if (a < 0 && b >= 0) return (k - 1) + (-a) / (b - a);
    }
    if (series.length && series[0].cum >= 0) return 0;
    return null;
  }
  function npv(series, ratePct) {
    const d = num(ratePct) / 100;
    let v = series[0].cum;
    for (let k = 1; k < series.length; k++) v += series[k].net / Math.pow(1 + d, k);
    return v;
  }

  // ---------- 表示用 ----------
  function roundInt(x) { const n = Number(x); return Number.isFinite(n) ? Math.round(n) : 0; }
  function fmtMan(x) { return roundInt(x).toLocaleString('ja-JP'); }
  function fmtYears(y) { return isBlank(y) ? null : (Math.round(y * 10) / 10).toFixed(1); }
  function fmtDec(x, maxDigits) {
    const n = Number(x); if (!Number.isFinite(n)) return '0';
    return String(Number(n.toFixed(maxDigits === undefined ? 2 : maxDigits)));
  }

  /** 3行固定のサマリー文 */
  function summaryText(p, r) {
    const persons = fmtDec(!isBlank(p.effectivePersonsPerShift) ? p.effectivePersonsPerShift : p.personsPerShift, 2);
    const l1 = `LexxMoMa ${p.robotUnits || 1}台の導入により、${normalizeShifts(p.shifts)}直体制で1直あたり${persons}人の省人化（再配置）を想定し、年間${fmtMan(r.annualSaving0)}万円の効果を見込む。`;
    const head = `初期投資${fmtMan(r.capexTotal)}万円・年間ランニング${fmtMan(r.opexAnnual)}万円に対し、`;
    const tail = `（人件費上昇率${fmtDec(p.wageGrowth, 1)}%/年で試算）。`;
    const l2 = r.paybackYears === null
      ? `${head}評価期間${r.years}年以内では回収に至らない${tail}`
      : `${head}投資回収年数は${fmtYears(r.paybackYears)}年${tail}`;
    const l3 = `${r.years}年間の累積効果は${fmtMan(r.cumFinal)}万円。`;
    return [l1, l2, l3].join('\n');
  }

  /** シナリオA/B 保存用スナップショット */
  function snapshot(state, p, r) {
    return {
      name: state.scenarioName || '',
      mode: p.mode,
      inputs: {
        laborCostPerPerson: p.laborCostPerPerson,
        shifts: p.shifts,
        personsPerShift: p.personsPerShift,
        effectivePersonsPerShift: p.effectivePersonsPerShift,
        wageGrowth: p.wageGrowth,
        capexTotal: p.capexTotal,
        opexAnnual: p.opexAnnual,
        years: p.years,
        extraAnnual: p.extraAnnual
      },
      result: {
        error: r.error, paybackYears: r.paybackYears, cumFinal: r.cumFinal,
        annualSaving0: r.annualSaving0, npv: r.npv
      },
      series: r.series.map(s => ({ year: s.year, cum: s.cum }))
    };
  }

  /** メーター色判定 */
  function paybackColor(years, thresholds) {
    const t = thresholds || DEFAULT_STATE.thresholds;
    if (isBlank(years)) return 'grey';
    if (years <= num(t.green)) return 'green';
    if (years <= num(t.yellow)) return 'yellow';
    return 'grey';
  }

  return {
    DEFAULT_STATE, defaultState, mergeState, deepClone,
    num, isBlank, isInvalid, normalizeShifts, normalizeYears,
    laborCostFromWage, effectivePersonsPerShift, sumItems, qty, amount, sumAmounts, allBlank, hourlyRate,
    resolveInputs, compute, paybackYears, npv,
    roundInt, fmtMan, fmtYears, fmtDec, summaryText, snapshot, paybackColor
  };
});

</script>
<script>
/* LexxMoMa 費用対効果 簡易計算ツール — csv.js
 * CSV生成（UTF-8 BOM・CRLF・RFC4180）とダウンロード。生成部はDOM非依存。 */
(function (root, factory) {
  'use strict';
  const calc = (typeof module === 'object' && module.exports) ? require('./calc.js') : root.LXCALC;
  const api = factory(calc);
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.LXCSV = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (C) {
  'use strict';

  const BOM = '﻿';
  const CRLF = '\r\n';

  function esc(v) {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function row(cells) { return cells.map(esc).join(','); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtDateTime(d) {
    return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function yyyymmdd(d) { return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
  function int(x) { return C.roundInt(x); }
  function pb(y) { return y === null || y === undefined ? '' : C.fmtYears(y); }

  /** ファイル名：LexxMoMa_ROI_{シナリオ名 or 無題}_{YYYYMMDD}.csv */
  function fileName(scenarioName, date) {
    const raw = (scenarioName || '').trim() || '無題';
    const safe = raw.replace(/[\\/:*?"<>|\r\n\t]/g, '_');
    return `LexxMoMa_ROI_${safe}_${yyyymmdd(date || new Date())}.csv`;
  }

  /** 入力一覧（モードに応じて全入力）：[項目, 値, 単位] の配列 */
  function inputRows(state, p) {
    const b = state.base, d = state.detail;
    const rows = [];
    if (p.mode === 'light') {
      rows.push(['1人あたり年間人件費＋管理費', int(p.laborCostPerPerson), '万円/年']);
    } else {
      rows.push(['直接人件費（年）', int(d.wage.base), '万円']);
      rows.push(['法定福利・管理費率', C.fmtDec(C.num(d.wage.overheadRate), 2), '%']);
      rows.push(['年間残業時間/人', C.fmtDec(C.num(d.wage.overtimeHours), 2), 'h']);
      rows.push(['残業単価', int(d.wage.overtimeRate), '円/h']);
      rows.push(['採用・教育費（年・1人あたり）', int(d.wage.hiringTraining), '万円']);
      rows.push(['1人あたり年間人件費＋管理費（合計）', int(p.laborCostPerPerson), '万円/年']);
    }
    rows.push(['直数', p.shifts, '直']);
    rows.push(['1直あたり省人化（再配置）人数', C.fmtDec(p.personsPerShift, 2), '人']);
    if (p.mode === 'detail') {
      rows.push(['年間稼働日', int(d.ops.workingDays), '日']);
      rows.push(['1直あたり時間', C.fmtDec(C.num(d.ops.hoursPerShift), 2), 'h']);
      rows.push(['1台が担当するステーション数', C.fmtDec(C.num(d.ops.stationsPerRobot), 2), '箇所']);
      rows.push(['目標可動率', C.fmtDec(C.num(d.ops.availability), 2), '%']);
      rows.push(['実効 1直あたり省人化（再配置）人数', C.fmtDec(p.effectivePersonsPerShift, 3), '人']);
    }
    rows.push(['人件費上昇率', C.fmtDec(p.wageGrowth, 2), '%/年']);
    // 初期投資：単価 × 数量 = 金額
    const capexRow = (label, price, q, unit) => {
      rows.push([`初期投資 ${label}（単価）`, int(price), '万円']);
      rows.push([`初期投資 ${label}（数量）`, C.fmtDec(C.qty(q), 2), unit]);

    L.push(row(['モード', p.mode === 'detail' ? '精緻' : 'ライト', '']));
    L.push(row(['シナリオ名', state.scenarioName || '', '']));

    L.push(row(['初年度 年間省人効果', int(r.annualSaving0), '万円']));
    L.push(row([`${r.years}年累積効果`, int(r.cumFinal), '万円']));
    L.push(row(['初期投資 合計', int(r.capexTotal), '万円']));
    L.push(row(['年間ランニング費', int(r.opexAnnual), '万円']));
    if (r.npv !== null && r.npv !== undefined) L.push(row(['NPV', int(r.npv), '万円']));
    L.push('');
    // [入力一覧]
    L.push('[入力一覧]');
    L.push(row(['項目', '値', '単位']));

    L.push('');
    // [年次表]
    L.push('[年次表]');
    L.push(row(['年', '年間省人効果', '年間ランニング費', '年間純効果', '累積キャッシュフロー']));
    r.series.forEach(s => L.push(row([s.year, int(s.saving), int(s.opex), int(s.net), int(s.cum)])));

      L.push('[シナリオ比較]');

  /** ブラウザでのダウンロード（Blob + a[download]） */
  function download(text, filename) {

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();

      if (note) note.textContent = manual ? '合計を直接入力中（項目を編集すると自動合計に戻ります）' : '展開項目の合計（直接入力で上書き可）';
    });

  // ============ 結果：メーター ============
  function polar(cx, cy, r, deg) { const a = deg * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy - r * Math.sin(a) }; }
  function arcPath(cx, cy, r, fromV, toV, max) {
    const a1 = 180 - 180 * Math.max(0, Math.min(max, fromV)) / max;
    const a2 = 180 - 180 * Math.max(0, Math.min(max, toV)) / max;
    if (Math.abs(a1 - a2) < 0.01) return '';
    const p1 = polar(cx, cy, r, a1), p2 = polar(cx, cy, r, a2);
    return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  function renderGauge(p, r) {
    const el = $('#gauge');
    if (r.error === 'NO_CAPEX') {
      el.innerHTML = `<div class="placeholder"><b>初期投資を入力してください</b><div class="tip">お見積書の金額を4欄に転記してください。<br>入力と同時に投資回収年数が表示されます。</div></div>`;
      return;
    }
    const max = r.years, t = state.thresholds;
    const g = Math.min(C.num(t.green), max), y = Math.min(Math.max(C.num(t.yellow), g), max);
    const cx = 150, cy = 150, R = 118, W = 22;
    const pb = r.paybackYears;
    const color = C.paybackColor(pb, t);
    const colHex = { green: COLORS.accent, yellow: COLORS.yellow, grey: COLORS.grey }[color];
    const needleV = pb === null ? max : Math.min(pb, max);
    const na = 180 - 180 * needleV / max;
    const tip = polar(cx, cy, R - W / 2 - 6, na), base1 = polar(cx, cy, 14, na + 90), base2 = polar(cx, cy, 14, na - 90);
    const ticks = [];
    for (let i = 0; i <= max; i++) {
      const a = 180 - 180 * i / max; const o = polar(cx, cy, R + 16, a);
      ticks.push(`<text x="${o.x.toFixed(1)}" y="${(o.y + 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="${COLORS.muted}">${i}</text>`);
    }
    const status = pb === null
      ? `評価期間 ${max} 年以内に回収しません`
      : (color === 'green' ? `稟議基準（緑 ≤ ${C.fmtDec(t.green, 1)} 年）を満たします`
        : color === 'yellow' ? `黄（≤ ${C.fmtDec(t.yellow, 1)} 年）の範囲です`
          : `回収まで ${C.fmtDec(t.yellow, 1)} 年超`);
    el.innerHTML = `<div class="gauge">
      <svg viewBox="0 0 300 175" role="img" aria-label="投資回収年数メーター">
        <path d="${arcPath(cx, cy, R, 0, max, max)}" fill="none" stroke="${COLORS.track}" stroke-width="${W}" />
        <path d="${arcPath(cx, cy, R, 0, g, max)}" fill="none" stroke="${COLORS.accent}" stroke-width="${W}" />
        <path d="${arcPath(cx, cy, R, g, y, max)}" fill="none" stroke="${COLORS.yellow}" stroke-width="${W}" />
        <path d="${arcPath(cx, cy, R, y, max, max)}" fill="none" stroke="${COLORS.grey}" stroke-width="${W}" />
        ${ticks.join('')}
        <polygon points="${tip.x.toFixed(1)},${tip.y.toFixed(1)} ${base1.x.toFixed(1)},${base1.y.toFixed(1)} ${base2.x.toFixed(1)},${base2.y.toFixed(1)}" fill="${COLORS.text}" />
        <circle cx="${cx}" cy="${cy}" r="9" fill="${COLORS.bg}" stroke="${COLORS.text}" stroke-width="3" />
        <text x="${cx}" y="${cy + 22}" text-anchor="middle" font-size="11" fill="${COLORS.muted}">投資回収年数（年）</text>
      </svg>
      <div class="big" style="color:${pb === null ? COLORS.grey : colHex}">${pb === null ? '—' : C.fmtYears(pb)}<small>年</small></div>
      <div class="status">${status}</div>
      <div class="legend"><span><i style="background:${COLORS.accent}"></i>≤${C.fmtDec(t.green, 1)}年</span><span><i style="background:${COLORS.yellow}"></i>≤${C.fmtDec(t.yellow, 1)}年</span><span><i style="background:${COLORS.grey}"></i>それ以上</span></div>
    </div>`;
  }

  // ============ 結果：KPI ============
  function renderKpis(p, r) {
    const el = $('#kpis');
    const disabled = r.error === 'NO_CAPEX';
    const kp = (k, v, unit, cls, sub) => `<div class="kpi ${cls || ''}"><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
    let h = '';
    h += kp('初年度 年間省人効果', C.fmtMan(r.annualSaving0), '万円/年', 'accent',
      `${C.fmtMan(p.laborCostPerPerson)}万円 × ${p.shifts}直 × ${C.fmtDec(p.effectivePersonsPerShift, 3)}人` + (r.extraAnnual > 0 ? `　＋付加効果 ${C.fmtMan(r.extraAnnual)}万円/年` : ''));
    h += kp(`${r.years}年累積効果`, disabled ? '—' : C.fmtMan(r.cumFinal), '万円', disabled ? 'muted' : (r.cumFinal < 0 ? 'neg' : ''), disabled ? '初期投資の入力後に表示' : `初期投資・ランニング費を差し引いた累積キャッシュフロー`);
    h += kp('初期投資 合計', C.fmtMan(p.capexTotal), '万円', 'muted', `機体 ${C.fmtMan(p.capex.robot)} / カメラ ${C.fmtMan(p.capex.camera)} / EE ${C.fmtMan(p.capex.endEffector)} / 導入・周辺 ${C.fmtMan(p.capex.integration)}`);
    h += kp('年間ランニング費', C.fmtMan(p.opexAnnual), '万円/年', 'muted', `人件費上昇率 ${C.fmtDec(p.wageGrowth, 1)}%/年・評価期間 ${r.years}年`);
    if (r.npv !== null && r.npv !== undefined) {
      h += kp(`NPV（割引率 ${C.fmtDec(p.discountRate, 1)}%）`, C.fmtMan(r.npv), '万円', r.npv < 0 ? 'neg' : 'accent', `${r.years}年間の純効果を現在価値に換算し初期投資を差し引いた額`);
    }
    el.innerHTML = h;
  }

  // ============ 結果：累積CF棒グラフ ============
  function renderChart(p, r) {
    const el = $('#chart');
    const A = state.scenarios.A, B = state.scenarios.B;
    const both = !!(A && B && !A.result.error && !B.result.error);
    let series;
    if (both) {
      series = [{ name: `A：${A.name || '無題'}`, color: COLORS.primary, cum: A.series.map(s => s.cum), pb: A.result.paybackYears },
      { name: `B：${B.name || '無題'}`, color: COLORS.accent, cum: B.series.map(s => s.cum), pb: B.result.paybackYears }];
    } else {
      if (r.error === 'NO_CAPEX') { el.innerHTML = ''; return; }
      series = [{ name: '現在の入力', color: COLORS.primary, cum: r.series.map(s => s.cum), pb: r.paybackYears }];
    }
    const N = Math.max(...series.map(s => s.cum.length - 1));
    const W = 640, H = 260, mL = 70, mR = 16, mT = 18, mB = 34;
    const iw = W - mL - mR, ih = H - mT - mB;
    let vmin = 0, vmax = 0;
    series.forEach(s => s.cum.forEach(v => { vmin = Math.min(vmin, v); vmax = Math.max(vmax, v); }));
    if (vmax === vmin) vmax = vmin + 1;
    const pad = (vmax - vmin) * 0.12; vmax += pad; vmin -= pad;
    const yOf = v => mT + (vmax - v) / (vmax - vmin) * ih;
    const groupW = iw / (N + 1);
    const barW = Math.min(46, groupW * (both ? 0.36 : 0.6));
    const xOf = (i, k) => mL + groupW * i + groupW / 2 + (both ? (k === 0 ? -barW / 2 - 2 : barW / 2 + 2) : 0);
    // y 目盛
    const step = niceStep((vmax - vmin) / 5);
    let g = '';
    for (let v = Math.ceil(vmin / step) * step; v <= vmax; v += step) {
      const y = yOf(v);
      g += `<line x1="${mL}" x2="${W - mR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${v === 0 ? COLORS.text : COLORS.track}" stroke-width="${v === 0 ? 1.2 : 1}" />
            <text x="${mL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="${COLORS.muted}">${C.fmtMan(v)}</text>`;
    }
    let bars = '';
    series.forEach((s, k) => {
      s.cum.forEach((v, i) => {
        const x = xOf(i, k) - barW / 2, y0 = yOf(0), y1 = yOf(v);
        const top = Math.min(y0, y1), hgt = Math.max(1, Math.abs(y1 - y0));
        bars += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${s.color}" fill-opacity="${v < 0 ? 0.45 : 1}" />`;
        if (!both) {
          const ly = v >= 0 ? top - 5 : top + hgt + 12;
          bars += `<text x="${(x + barW / 2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="10.5" fill="${v < 0 ? COLORS.muted : COLORS.text}">${C.fmtMan(v)}</text>`;
        }
      });
      if (s.pb !== null && s.pb !== undefined) {
        const px = mL + groupW * s.pb + groupW / 2;
        bars += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${mT}" y2="${mT + ih}" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="4 3" />
                 <text x="${(px + 4).toFixed(1)}" y="${mT + 10}" font-size="10.5" fill="${s.color}">回収 ${C.fmtYears(s.pb)} 年</text>`;
      }
    });
    let xl = '';
    for (let i = 0; i <= N; i++) xl += `<text x="${(mL + groupW * i + groupW / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="${COLORS.muted}">${i === 0 ? '導入時' : i + '年目'}</text>`;
    el.innerHTML = `<div class="chart-title"><span>累積キャッシュフロー（万円）</span>
        <span class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="累積キャッシュフロー棒グラフ">${g}${bars}${xl}</svg>`;
  }
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
  }

  // ============ 結果：シナリオ比較 ============
  function renderCompare() {
    const el = $('#compare');
    const A = state.scenarios.A, B = state.scenarios.B;
    const cell = (s, f, cls) => s ? `<td class="${cls || ''}">${f(s)}</td>` : '<td class="empty">未保存</td>';
    const pbTxt = s => s.result.error ? '—' : (s.result.paybackYears === null ? '未回収' : `${C.fmtYears(s.result.paybackYears)} 年`);
    const rows = [
      ['1人あたり年間人件費＋管理費', s => `${C.fmtMan(s.inputs.laborCostPerPerson)} 万円/年`],
      ['直数', s => `${s.inputs.shifts} 直`],
      ['1直あたり省人化（再配置）人数', s => `${C.fmtDec(s.inputs.effectivePersonsPerShift, 3)} 人`],
      ['初期投資 合計', s => `${C.fmtMan(s.inputs.capexTotal)} 万円`],
      ['投資回収年数', pbTxt, true],
      ['累積効果', s => `${C.fmtMan(s.result.cumFinal)} 万円（${s.inputs.years}年）`, true]
    ];
    el.innerHTML = `<div class="compare-head">
        <h3>シナリオ A/B 比較</h3>
        <button type="button" class="btn sm" id="saveA">現在の入力をシナリオAに保存</button>
        <button type="button" class="btn accent sm" id="saveB">Bに保存</button>
        <button type="button" class="btn ghost sm" id="clearAB" ${A || B ? '' : 'disabled'}>クリア</button>
      </div>
      <table class="compare">
        <thead><tr><th>項目</th><th class="a">シナリオA${A ? `：${esc(A.name || '無題')}` : ''}</th><th class="b">シナリオB${B ? `：${esc(B.name || '無題')}` : ''}</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="${r[2] ? 'hl' : ''}"><td>${r[0]}</td>${cell(A, r[1])}${cell(B, r[1])}</tr>`).join('')}</tbody>
      </table>`;
    $('#saveA').onclick = () => saveScenario('A');
    $('#saveB').onclick = () => saveScenario('B');
    $('#clearAB').onclick = () => { state.scenarios = { A: null, B: null }; schedule(); toast('シナリオA/Bをクリアしました'); };
  }
  function saveScenario(key) {
    const p = C.resolveInputs(state), r = C.compute(p);
    if (r.error) { toast('初期投資を入力してから保存してください'); return; }
    state.scenarios[key] = C.snapshot(state, p, r);
    schedule();
    toast(`シナリオ${key}に保存しました`);
  }

  // ============ 印刷用入力サマリー ============
  function renderPrintSummary(p) {
    const rows = CSV.inputRows(state, p);
    const cols = rows.length > 20 ? 3 : 2;
    const per = Math.ceil(rows.length / cols);
    const tbl = rs => `<table>${rs.map(r => `<tr><td>${esc(r[0])}</td><td class="v">${esc(r[1])} ${esc(r[2])}</td></tr>`).join('')}</table>`;
    const parts = []; for (let i = 0; i < cols; i++) parts.push(tbl(rows.slice(i * per, (i + 1) * per)));
    $('#printSummary').innerHTML = `<h2>入力サマリー（${p.mode === 'detail' ? '精緻' : 'ライト'}モード${state.scenarioName ? '・' + esc(state.scenarioName) : ''}）</h2>
      <div class="cols ${cols === 3 ? 'three' : ''}">${parts.join('')}</div>`;
    $('#scnLabel').dataset.print = state.scenarioName ? `：${state.scenarioName}` : '：（無題）';
  }

  // ============ 再計算・再描画（rAFでスロットル） ============
  let raf = 0;
  function schedule() {
    if (raf) return;
    const tick = () => { raf = 0; render(); };
    // 非表示タブでは rAF が止まるため setTimeout に切り替える
    raf = document.hidden ? setTimeout(tick, 16) : requestAnimationFrame(tick);
  }
  function render() {
    const p = C.resolveInputs(state), r = C.compute(p);
    updateDerived(p, r);
    renderGauge(p, r);
    renderKpis(p, r);
    renderChart(p, r);
    renderCompare();
    renderPrintSummary(p);
    renderScene(p, r);
    writeHash();
  }

  // ============ 工場タイクーン 3D（結果パネル最上段） ============
  let scene = null;
  function renderScene(p, r) {
    if (!window.LXSCENE) return;
    if (!scene) {
      scene = LXSCENE.create($('#sceneCanvas'), {
        onView: v => {
          $$('#viewToggle button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
          $('#sceneCaption').textContent = v === 'before' ? 'Before：現状（手作業）' : 'After：LexxMoMa 導入後';
        },
        onEvent: (ev, count) => {
          $$('.ev-btn').forEach(b => { b.disabled = !!ev; b.classList.toggle('active', !!ev && ev.type === b.dataset.ev); });
          $('#evCount').textContent = ev && ev.type === 'medic' ? '救急搬送中…' : `イベント ${Math.min(count, 3)}/3`;
        }
      });
      $('#evCount').textContent = 'イベント 0/3';
    }
    const m = scene.update(p, r, state);
    $('#viewToggle button[data-view="after"]').disabled = !m.robot;
    $('#viewToggle button[data-view="after"]').title = m.robot ? '' : '「機体」に金額を入れると After が見られます';
  }
  function bindScene() {
    $$('#viewToggle button').forEach(b => b.addEventListener('click', () => { if (scene && !b.disabled) scene.setView(b.dataset.view); }));
    $('#scenePlay').addEventListener('click', () => {
      if (!scene) return;
      const running = scene.toggle();
      $('#scenePlay').textContent = running ? '⏸ 一時停止' : '▶ 再生';
      $('#scenePlay').setAttribute('aria-pressed', String(running));
    });
    $('#sceneReset').addEventListener('click', () => { if (scene) scene.resetCamera(); });
    $$('.ev-btn').forEach(b => b.addEventListener('click', () => {
      if (!scene) return;
      if (!scene.running) { scene.toggle(); $('#scenePlay').textContent = '⏸ 一時停止'; $('#scenePlay').setAttribute('aria-pressed', 'true'); }
      scene.trigger(b.dataset.ev);
    }));
  }
  function applyLayout() {
    const w = Math.max(360, Math.min(900, C.num(state.ui.inputWidth) || 470));
    document.documentElement.style.setProperty('--inputs-w', w + 'px');
  }
  function bindLayout() {
    const sp = $('#splitter');
    sp.addEventListener('pointerdown', e => {
      e.preventDefault();
      sp.classList.add('drag'); sp.setPointerCapture(e.pointerId);
      const startX = e.clientX, startW = C.num(state.ui.inputWidth) || 470;
      const move = ev => { state.ui.inputWidth = Math.round(startW + (ev.clientX - startX)); applyLayout(); };
      const up = ev => { sp.classList.remove('drag'); sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); writeHash(); };
      sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
    });
    sp.addEventListener('dblclick', () => { state.ui.inputWidth = 470; applyLayout(); writeHash(); });
  }

  // ============ モード切替（値は失わない） ============
  function switchMode(mode) {
    if (mode === state.mode) return;
    const p = C.resolveInputs(state);
    const d = state.detail, b = state.base;
    if (mode === 'detail') {
      // ライト → 精緻：ライト値を合計欄に直接持つ（展開項目は按分しない）。展開項目の合計と一致すれば自動算出に戻す
      const setOv = (key, raw) => {
        if (C.isBlank(raw)) { d.override[key] = null; return; }
        d.override[key] = Math.abs(C.num(raw) - p.derived[key]) < 1e-9 ? null : raw;
      };
      setOv('labor', b.laborCostPerPerson);
      setOv('integration', b.capex.integration);
      setOv('opex', b.opexAnnual);
    } else {
      // 精緻 → ライト：合計値を書き戻す
      b.laborCostPerPerson = round2(p.laborCostPerPerson);
      b.capex.integration = (p.capex.integration === 0 && C.allBlank(d.capex) && C.isBlank(d.override.integration)) ? '' : round2(p.capex.integration);
      b.opexAnnual = (p.opexAnnual === 0 && C.allBlank(d.opex) && C.isBlank(d.override.opex)) ? '' : round2(p.opexAnnual);
    }
    state.mode = mode;
    $$('.mode-toggle button').forEach(x => x.classList.toggle('on', x.dataset.mode === mode));
    renderInputs();
    render();
  }
  function round2(x) { return Math.round(x * 100) / 100; }

  // ============ イベント ============
  function bindEvents() {
    const inputs = $('#inputs');
    inputs.addEventListener('input', e => {
      const el = e.target; const path = el.dataset.path; if (!path) return;
      if (el.type === 'checkbox') { setPath(state, path, el.checked); renderInputs(); schedule(); return; }
      const raw = el.value;
      setPath(state, path, storeValue(raw));
      el.classList.toggle('warn', C.isInvalid(raw));
      // スライダー⇄数値の同期
      $$(`[data-path="${path}"]`, inputs).forEach(o => {
        if (o === el) return;
        if (o.type === 'range') o.value = C.num(raw); else o.value = raw;
        o.classList.toggle('warn', C.isInvalid(raw));
      });
      if (el.dataset.group) state.detail.override[el.dataset.group] = null;   // 展開項目を触ったら自動合計に戻す
      if (el.dataset.total && raw === '') state.detail.override[el.dataset.total] = null;
      schedule();
    });
    inputs.addEventListener('click', e => {
      const btn = e.target.closest('.btn-group button'); if (!btn) return;
      const grp = btn.parentElement; const path = grp.dataset.path;
      setPath(state, path, Number(btn.dataset.value));
      $$('button', grp).forEach(x => x.classList.toggle('on', x === btn));
      schedule();
    });
    $$('.mode-toggle button').forEach(b => b.addEventListener('click', () => switchMode(b.dataset.mode)));
    $('#scenarioName').addEventListener('input', e => { state.scenarioName = e.target.value; schedule(); });

    // アクション
    $('#btnCsv').addEventListener('click', () => {
      const p = C.resolveInputs(state), r = C.compute(p); const now = new Date();
      CSV.download(CSV.buildCsv({ state, params: p, result: r, now }), CSV.fileName(state.scenarioName, now));
      toast('CSVをダウンロードしました');
    });
    $('#btnSummary').addEventListener('click', async () => {
      const p = C.resolveInputs(state), r = C.compute(p);
      if (r.error) { toast('初期投資を入力してください'); return; }
      const ok = await copyText(C.summaryText(p, r));
      toast(ok ? 'サマリー文をコピーしました' : 'コピーできませんでした');
    });
    $('#btnPrint').addEventListener('click', () => { render(); window.print(); });
    $('#btnUrl').addEventListener('click', async () => {
      writeHash();
      const ok = await copyText(location.href);
      toast(ok ? 'URLをコピーしました（入力・シナリオA/B・しきい値を含みます）' : 'コピーできませんでした');
    });
    $('#btnReset').addEventListener('click', () => {
      if (!confirm('入力を初期値に戻します。シナリオA/Bも消えます。よろしいですか？')) return;
      state = C.defaultState();
      $('#scenarioName').value = '';
      $$('.mode-toggle button').forEach(x => x.classList.toggle('on', x.dataset.mode === 'light'));
      renderInputs(); applyLayout(); render();
    });

    // しきい値ダイアログ
    const dlg = $('#dlgThreshold');
    $('#btnGear').addEventListener('click', () => {
      $('#thGreen').value = state.thresholds.green; $('#thYellow').value = state.thresholds.yellow;
      dlg.showModal();
    });
    const onTh = () => {
      state.thresholds.green = storeValue($('#thGreen').value);
      state.thresholds.yellow = storeValue($('#thYellow').value);
      schedule();
    };
    $('#thGreen').addEventListener('input', onTh);
    $('#thYellow').addEventListener('input', onTh);
    $('#thDefault').addEventListener('click', () => { state.thresholds = C.deepClone(C.DEFAULT_STATE.thresholds); $('#thGreen').value = 2; $('#thYellow').value = 3; schedule(); });
    $('#thClose').addEventListener('click', () => dlg.close());

    window.addEventListener('hashchange', () => {
      const cur = '#' + encodeState(state);
      if (location.hash === cur) return;
      loadFromHash(); syncHeader(); renderInputs(); applyLayout(); render();
    });
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext !== false) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* fall through */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function syncHeader() {
    $('#scenarioName').value = state.scenarioName || '';
    $$('.mode-toggle button').forEach(x => x.classList.toggle('on', x.dataset.mode === state.mode));
  }

  // ============ 起動 ============
  loadFromHash();
  syncHeader();
  renderInputs();
  bindEvents();
  bindLayout();
  bindScene();
  applyLayout();
  render();

  // テーマ切替: 色を読み直して再描画。印刷(A4)は常に light で出す
  document.addEventListener('lx-theme', () => { readThemeColors(); render(); });
  let printTheme = null;
  window.addEventListener('beforeprint', () => {
    printTheme = document.documentElement.getAttribute('data-theme');
    if (printTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'light'); readThemeColors(); render(); }
  });
  window.addEventListener('afterprint', () => {
    if (printTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); readThemeColors(); render(); }
    printTheme = null;
  });

  // デバッグ・テスト用（計算はすべて LXCALC 側）
  window.LXROI = { getState: () => state, setState: s => { state = C.mergeState(C.defaultState(), s); syncHeader(); renderInputs(); applyLayout(); render(); }, render, scene: () => scene };
})();

</script>
</body>
</html>
