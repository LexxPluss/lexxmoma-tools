<script>
/* =====================================================================
   CONFIG（config.js 相当）
   ここにある数値はすべて仮値です。変更して再読み込みすると、3Dモデル・寸法表示・
   右パネル・比較表の数値がまとめて変わります。単位は mm / kg / 秒。
   ===================================================================== */
const CONFIG = {
  moma: {
    baseW: 700,        // 走行台車の幅（仮）
    baseL: 1000,       // 走行台車の長さ（仮）
    baseH: 400,        // 台車の天板高さ（仮）
    aisleTurn: 1500,   // 旋回に必要な通路幅（仮）
    armReach: 1300,    // アームのリーチ（仮）。肩〜手首の長さとして扱う
    payloadKg: 10,     // アームの可搬重量（仮）
    toolLen: 150,      // 手首から手先（グリッパ先端）までの長さ（仮）
    maxBoxes: 4,       // 1回の巡回で台車に積める箱数（仮）
    clearance: 150,    // 棚の通路側の面と台車のすき間（仮）
  },
  shooter: {
    laneW: 500,        // 間口幅（仮・代表値 400〜600）
    pickHmin: 700,     // 人の取り出し域の下限（仮）
    pickHmax: 1500,    // 人の取り出し域の上限（仮）
  },
  box: { w: 400, d: 300, h: 200, kg: 10, gap: 10 },  // 標準の通い箱（仮）。w=間口方向、d=奥行き方向
  worker: { height: 1700 },                           // 作業者の身長（仮）
  line: { zoneDepth: 1500 },                          // ライン側の作業域の奥行き（仮）
  estimate: {                                         // MoMa 1台あたりの担当間口数の目安の計算用（仮）
    utilization: 0.75,         // MoMaの稼働率（充電・待ちを除く）
    boxesPerLanePerHour: 1.5,  // 1間口あたりの消費箱数（箱/時）
  },
  plans: {
    p1: { cols: 3, levels: 3, depth: 1500, levelPitch: 280, slopePct: 4, secPerBox: 75 },
    p2: { cols: 3, levels: 3, depth: 1000, levelPitch: 260, secPerBox: 65 },
    p3: { cols: 5, levels: 4, depth: 1000, levelPitch: 200, slopePct: 3, laneW: 340,
          boxW: 300, boxD: 400, boxH: 150, boxKg: 7, reserveH: 250, secPerBox: 60 },
    p4: { units: 4, levels: 2, depth: 900, levelPitch: 280, slopePct: 3, gap: 60, firstH: 800, secPerBox: 75 },
    p5: { kitW: 600, kitD: 400, kitH: 150, kitKg: 8, depth: 1800, laneH: 950, slopePct: 3,
          partsPerKit: 6, kitsPerHour: 30, secPerBox: 55,
          models: { A: { name: '車種A', color: '#E8A33D' }, B: { name: '車種B', color: '#8C6BB1' }, C: { name: '車種C', color: '#D9644A' } },
          sequence: ['A', 'B', 'A', 'C', 'C', 'A', 'B', 'A', 'C', 'B'] },
    p6: { cols: 3, levels: 3, depth: 1500, levelPitch: 260, slopePct: 4, secPerBox: 80 },
  },
  colors: {
    blue: '#0068B7', green: '#3EB370', retro: '#5AA0DC', frame: '#9AA6AF', roller: '#C5CDD3',
    powered: '#8FA9BF', plate: '#EEF2F5', empty: '#CDD5DB', dim: '#4F6575', floor: '#F7F9FA',
    sku: ['#E8A33D', '#D9644A', '#8C6BB1', '#A67C52', '#C2577F', '#6E7F8D'],
  },
};
</script>
<style>

<main id="main">
  <section id="stage">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ===================== 基本ユーティリティ ===================== */
const C = CONFIG, COL = CONFIG.colors;
const M = v => v / 1000;                      // mm → m（3D空間は 1単位 = 1m）
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const mm = v => Math.round(v * 1000);         // m → mm 表示
const shade = (hex, amt) => { const c = new THREE.Color(hex); c.lerp(new THREE.Color(amt > 0 ? '#ffffff' : '#000000'), Math.abs(amt)); return '#' + c.getHexString(); };
const _mc = {};
function mat(color, o = {}) { const k = color + JSON.stringify(o); return _mc[k] || (_mc[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.72, metalness: 0.05 }, o))); }
function mesh(geo, m, shadow = true) { const x = new THREE.Mesh(geo, m); x.castShadow = shadow; x.receiveShadow = true; return x; }
function addBox(parent, sx, sy, sz, color, x, y, z, o = {}) {
  const b = mesh(new THREE.BoxGeometry(sx, sy, sz), typeof color === 'string' ? mat(color, o.m || {}) : color);
  b.position.set(x, y, z); if (o.rx) b.rotation.x = o.rx; if (o.ry) b.rotation.y = o.ry; parent.add(b); return b;
}
const FONT = '"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","IPAGothic",sans-serif';
const _tc = {};
function textTex(lines, o = {}) {
  const key = JSON.stringify([lines, o]); if (_tc[key]) return _tc[key];
  const w = o.w || 256, h = o.h || 128, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = o.bg || '#fff'; g.fillRect(0, 0, w, h);
  if (o.border) { g.strokeStyle = o.border; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8); }
  const fs = o.font || 34, top = o.bars ? h * 0.34 : h / 2;
  g.fillStyle = o.fg || '#1d2a33'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 ${fs}px ${FONT}`;
  lines.forEach((s, i) => g.fillText(s, w / 2, top + (i - (lines.length - 1) / 2) * fs * 1.18));
  if (o.bars) {                                 // バーコード風の模様（文字列から決まる）
    g.fillStyle = '#fff'; g.fillRect(w * 0.18, h * 0.6, w * 0.64, h * 0.32);
    let seed = 0; for (const ch of lines.join('')) seed = (seed * 31 + ch.charCodeAt(0)) % 9973;
    g.fillStyle = '#111'; let x = w * 0.2;
    while (x < w * 0.8) { seed = (seed * 73 + 41) % 9973; const bw = 1 + seed % 4; g.fillRect(x, h * 0.63, bw, h * 0.26); x += bw + 1 + (seed >> 3) % 3; }
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return (_tc[key] = t);
}
function texMat(lines, o) { const k = 'T' + JSON.stringify([lines, o]); return _mc[k] || (_mc[k] = new THREE.MeshStandardMaterial({ map: textTex(lines, o), roughness: 0.8 })); }
function plane(parent, w, h, m, x, y, z, ry = 0) { const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.rotation.y = ry; parent.add(p); return p; }

/* ===================== 視点操作（OrbitControls 相当・自作） ===================== */
class Orbit {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom; this.target = V3(); this.r = 6; this.th = 0.8; this.ph = 1.0;
    this.ptr = new Map(); this.onChange = null;
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('pointerdown', e => { dom.setPointerCapture(e.pointerId); this.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button, s: e.shiftKey || e.ctrlKey || e.metaKey }); });
    dom.addEventListener('pointermove', e => this.move(e));
    const up = e => { this.ptr.delete(e.pointerId); this.pinch = null; };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e => { e.preventDefault(); this.zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });
  }
  set(pos, target) {
    this.target.copy(target); const d = pos.clone().sub(target);
    this.r = d.length(); this.ph = Math.acos(clamp(d.y / this.r, -1, 1)); this.th = Math.atan2(d.x, d.z); this.update();
  }
  zoom(f) { this.r = clamp(this.r * f, 1.2, 30); this.update(); }
  pan(dx, dy) {
    const s = this.r * 0.0016, cam = this.cam;
    const right = V3().setFromMatrixColumn(cam.matrix, 0), upv = V3().setFromMatrixColumn(cam.matrix, 1);
    this.target.addScaledVector(right, -dx * s).addScaledVector(upv, dy * s); this.update();
  }
  move(e) {
    const p = this.ptr.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (this.ptr.size === 2) {
      const [a, b] = [...this.ptr.values()]; p.x = e.clientX; p.y = e.clientY;
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (this.pinch) { this.zoom(this.pinch.d / dist); this.pan(mid.x - this.pinch.m.x, mid.y - this.pinch.m.y); }
      this.pinch = { d: dist, m: mid }; return;
    }
    p.x = e.clientX; p.y = e.clientY;
    if (p.b === 2 || p.b === 1 || p.s) this.pan(dx, dy);
    else { this.th -= dx * 0.006; this.ph = clamp(this.ph - dy * 0.006, 0.08, Math.PI / 2 - 0.02); this.update(); }
  }
  update() {
    const s = Math.sin(this.ph);
    this.cam.position.set(this.target.x + this.r * s * Math.sin(this.th), this.target.y + this.r * Math.cos(this.ph), this.target.z + this.r * s * Math.cos(this.th));
    this.cam.lookAt(this.target); this.cam.updateMatrixWorld();
  }
}

/* ===================== 部位ラベル・寸法線 ===================== */
let LABELS = [], DIMS = [], ROOT = null;
const labelLayer = document.getElementById('labels');
function label(target, html, kind = '', off = V3()) {
  const el = document.createElement('div'); el.className = 'lbl ' + kind; el.innerHTML = html; labelLayer.appendChild(el);
  const L = { el, target, off, kind }; LABELS.push(L); return L;
}
function unlabel(L) { if (!L) return; L.el.remove(); LABELS = LABELS.filter(x => x !== L); }
function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
const _pv = V3();
function updateLabels(cam, w, h) {
  const showL = document.getElementById('chkLbl').checked, showD = document.getElementById('chkDim').checked;
  const fixed = [], movable = [];
  for (const L of LABELS) {
    const isDim = L.kind.includes('dim'), isFlash = L.kind.includes('flash') || L.kind.includes('warn');
    let show = isDim ? showD : (showL || isFlash);
    if (L.target.isObject3D) { if (!visibleChain(L.target)) show = false; _pv.copy(L.off); L.target.localToWorld(_pv); }
    else _pv.copy(L.target);
    _pv.project(cam);
    if (!show || _pv.z > 1 || Math.abs(_pv.x) > 1.3 || Math.abs(_pv.y) > 1.3) { L.el.style.display = 'none'; continue; }
    if (L.el.style.display === 'none' || !L.w) { L.el.style.display = ''; L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; }
    L.x = (_pv.x * 0.5 + 0.5) * w; L.y = (-_pv.y * 0.5 + 0.5) * h; L.depth = _pv.z;
    (isDim || L.kind.includes('zone') ? fixed : movable).push(L);
  }
  // 重なりを避ける：寸法・床の表示は固定、部位ラベルは重なったら上へずらし、引き出し線を伸ばす
  const placed = [];
  for (const L of fixed) { const r = { l: L.x - L.w / 2, t: L.y - L.h / 2, r: L.x + L.w / 2, b: L.y + L.h / 2 }; placed.push(r); L.el.style.transform = `translate(${r.l}px,${r.t}px)`; }
  movable.sort((a, b) => (b.kind.includes('flash') - a.kind.includes('flash')) || (b.y - a.y));
  for (const L of movable) {
    const r = { l: L.x - L.w / 2, r: L.x + L.w / 2, b: L.y - 9, t: L.y - 9 - L.h };

/* ===================== ③ 高密度型 ===================== */
function buildP3(root) {
  const P = C.plans.p3, bx = { x: M(P.boxW), y: M(P.boxH), z: M(P.boxD) }, D = M(P.depth), laneW = M(P.laneW), colW = laneW + 0.05, tc = 1, tl = 2;

  const yR = M(P.reserveH);
  addBox(root, S.W, 0.02, D / 2 + 0.02, '#e6ecf0', 0, yR - 0.01, D * 0.75);

  const R = makeLane(root, { x: S.xc(tc), w: laneW, zF: D, yF: yRa, zB: 0, yB: yRl, box: bx, stopOff: 0.03, noDraw: true });
  const R3 = makeLane(root, { x: S.xc(3), w: laneW, zF: D, yF: yRa, zB: 0, yB: yRl, box: bx, stopOff: 0.03, noDraw: true });
  const e3 = makeBox(bx, sku(3, 0)); e3.userData.setEmpty(); putOnLane(R3, e3, 0);

  for (let c = 0; c < P.cols; c++) for (let l = 0; l < P.levels; l++) plane(root, laneW * 0.62, 0.034, texMat([sku(c, l).code], { bg: '#22303a', fg: '#8ff0b4', w: 192, h: 48, font: 30 }), S.xc(c), y0 + l * py - 0.03, -0.004, Math.PI);
  pickBand(root, -S.W / 2, S.W / 2, 0);
  const T = S.lanes[tc][tl];
  label(V3(S.xc(4), yR + 0.2, D * 0.75), `予備在庫段（MoMa専用・床上${P.reserveH}mm・仮）`, 'moma');
  label(V3(S.xc(3), yR + 0.18, D / 2 - 0.01), 'ライン側は閉じる（足元は使わない）');
  label(V3(S.xc(1), yRl + 0.1, 0.1), '共通の空箱返却棚（全列で1本・逆傾斜）');
  label(mk[1], '棚マーカー（左右2枚で全間口を計算）', 'retro', V3(0, 0.09, 0));
  label(V3(S.xc(0), y0 - 0.03, -0.01), '間口ごとの品番表示（電子表示）', 'human');
  label(S.lanes[4][3].posS(0.5).add(V3(0, 0.1, 0)), `低背箱 ${P.boxW}×${P.boxD}×${P.boxH}mm（仮）を横向きに`);
  dimLine(root, V3(-S.W / 2, S.H + 0.08, 0), V3(S.W / 2, S.H + 0.08, 0), `棚幅 ${mm(S.W)}mm（${P.cols}列×${P.levels}段＝${P.cols * P.levels}間口・仮）`);
  dimLine(root, V3(S.xc(4) - laneW / 2, y0 - 0.1, -0.02), V3(S.xc(4) + laneW / 2, y0 - 0.1, -0.02), `間口 ${P.laneW}mm（仮）`);
  dimLine(root, V3(-S.W / 2 - 0.3, 0.01, 0), V3(-S.W / 2 - 0.3, 0.01, D), `奥行き ${P.depth}mm（仮）`, V3(1, 0, 0));
  dimLine(root, V3(S.W / 2 + 0.15, 0, D), V3(S.W / 2 + 0.15, yR, D), `予備段 ${P.reserveH}mm（仮）`);
  dimLine(root, V3(S.W / 2 + 0.32, 0, 0), V3(S.W / 2 + 0.32, yRl, 0), `返却口 ${mm(yRl)}mm（仮）`);
  const W = makeWorker(); W.g.position.set(S.xc(tc), 0, -0.42); root.add(W.g);
  label(W.g, '作業者（4段×5列から取り出し）', 'human', V3(0, 1.85, 0));
  const m = makeMoMa({ box: bx, tool: 'gripper' }), zM = momaZ(D), stopX = S.xc(tc) - ARM_X();
  m.g.position.set(stopX, 0, zM); root.add(m.g); stopMark(root, stopX, zM); stopLabel(root, stopX, zM);

    A.advance(T, 1.2, '箱は列の最後尾へ'),

    A.arm(m, () => m.homeW(), 0.9, '手先を走行姿勢に戻す'),

/* ===================== ④ 可搬モジュール型 ===================== */
function buildP4(root) {
  const P = C.plans.p4, bx = boxDim(), D = M(P.depth), laneW = M(C.shooter.laneW), uw = laneW + 0.08, gap = M(P.gap), tu = 1;
  env(root, { zB: D });
  const total = P.units * uw + (P.units - 1) * gap, ux = i => -total / 2 + uw / 2 + i * (uw + gap);
  const retro = mat(COL.retro), retroL = mat(shade(COL.retro, 0.55)), dark = mat('#25323c');
  const mkUnit = (i, sk, id, fillN) => {
    const g = new THREE.Group(); g.position.set(ux(i), 0, 0); root.add(g);
    const S = buildIncline(g, { cx: 0, cols: 1, laneW, colW: uw, D, levels: P.levels, y0: M(P.firstH), pitchY: M(P.levelPitch), slope: P.slopePct / 100, box: bx, ret: true,
      sku: (c, l) => ({ color: COL.sku[(sk + l * 2) % COL.sku.length], code: `${id.replace('U-', 'K')}-${l + 1}` }), fill: (c, l) => fillN[l] });
    addBox(g, uw, 0.04, D, COL.frame, 0, 0.12, D / 2);
    for (const sx of [-1, 1]) for (const z of [0.07, D - 0.07]) { const w = mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.035, 14), dark); w.rotation.z = Math.PI / 2; w.position.set(sx * (uw / 2 - 0.06), 0.045, z); g.add(w); addBox(g, 0.05, 0.05, 0.05, '#7d8a94', sx * (uw / 2 - 0.06), 0.09, z); }
    addBox(g, uw - 0.04, 0.16, 0.01, retroL, 0, S.H - 0.13, D + 0.012);
    const mk = makeMarker(g, -0.13, S.H - 0.13, D + 0.019, 0.11, 30 + i);
    plane(g, 0.2, 0.1, texMat([id], { bg: COL.retro, fg: '#fff', font: 44, w: 128, h: 64 }), 0.1, S.H - 0.13, D + 0.019);
    plane(g, 0.34, 0.08, texMat([`品番 ${id.replace('U-', 'K')}`], { bg: '#fff', fg: '#23864f', border: COL.green, w: 256, h: 64, font: 28 }), 0, S.H - 0.13, -0.022, Math.PI);
    return { g, S, id, mk };
  };
  const units = [0, 1, 2, 3].slice(0, P.units).map(i => mkUnit(i, i, `U-0${i + 1}`, i === tu ? [2, 1] : [[1, 2], [2, 1], [1, 1], [2, 2]][i % 4]));
  const nu = mkUnit(P.units - 1, 4, 'U-05', [2, 2]); nu.g.visible = false; nu.g.position.z = D + 1.15;
  for (let i = 0; i < P.units; i++) {
    addBox(root, uw + 0.06, 0.008, 0.22, retro, ux(i), 0.004, D - 0.16);
    for (const sx of [-1, 1]) { const p = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.08, 10), retro); p.position.set(ux(i) + sx * 0.16, 0.044, D - 0.16); root.add(p); }
  }
  const U = units[tu], T = U.S.lanes[0][0], R = U.S.rets[0];
  pickBand(root, -total / 2, total / 2, 0);
  label(units[0].g, `ユニット（${units[0].id}〜${units[units.length - 1].id}）`, '', V3(0, units[0].S.H + 0.12, D / 2));
  label(nu.g, 'ユニット U-05（新しい品番・入れ替え用）', 'retro', V3(0, nu.S.H + 0.12, D / 2));
  label(V3(ux(3) + 0.16, 0.06, D - 0.16), '床の据付け基準板（ピン2本）', 'retro');
  label(units[3].g, '自在車輪（ロック付き）', '', V3(uw / 2 - 0.06, 0.1, 0.07));
  label(units[2].mk, 'ユニットIDマーカー', 'retro', V3(0, 0.08, 0));
  label(units[0].g, '差し替え式の品番表示', 'human', V3(0, units[0].S.H - 0.08, -0.03));
  label(units[0].S.rets[0].posS(D * 0.5).add(V3(0, 0.1, 0)), '空箱返却（ユニットごと）');
  dimLine(root, V3(ux(0) - uw / 2, units[0].S.H + 0.26, 0), V3(ux(0) + uw / 2, units[0].S.H + 0.26, 0), `ユニット幅 ${mm(uw)}mm（仮）`);
  dimLine(root, V3(ux(0) + uw / 2, 0.3, -0.02), V3(ux(1) - uw / 2, 0.3, -0.02), `すき間 ${P.gap}mm（仮）`);
  dimLine(root, V3(-total / 2 - 0.3, 0.01, 0), V3(-total / 2 - 0.3, 0.01, D), `奥行き ${P.depth}mm（仮）`, V3(1, 0, 0));
  dimLine(root, V3(total / 2 + 0.15, 0, D), V3(total / 2 + 0.15, units[0].S.H, D), `ユニット高さ ${mm(units[0].S.H)}mm（仮）`);
  const W = makeWorker(); W.g.position.set(ux(tu), 0, -0.42); root.add(W.g);
  label(W.g, '作業者（ユニットが変わっても取り方は同じ）', 'human', V3(0, 1.85, 0));
  const m = makeMoMa({ box: bx, tool: 'gripper' }), zM = momaZ(D), stopX = ux(tu) - ARM_X();
  m.g.position.set(stopX, 0, zM); root.add(m.g); stopMark(root, stopX, zM); stopLabel(root, stopX, zM);
  const s0 = T.q[0].userData;
  const deck = [makeBox(bx, { color: COL.sku[(tu) % 6], code: 'K02-1' }), makeBox(bx, { color: COL.sku[2], code: 'K03-2' }), makeBox(bx, { color: COL.sku[3], code: 'K04-1' }), makeBox(bx, { color: COL.sku[0], code: 'K01-2' })];
  m.fill(deck); m.ik(m.homeW()); momaLabels(m, 'グリッパ＋手先カメラ');
  payloadCheck(C.box.kg, '標準箱');
  const empty = T.q[0], old = units[P.units - 1];
  const steps = [
    A.call(() => { m.g.position.x = -4.3; }, '消費連動：取り出しの信号を受けてMoMaが出発', 0.6),
    A.drive(m, stopX, 3.0, 'MoMaがユニット U-02 の前（床の目印）に停止'),
    ...workerPick(W, T, 'ライン側：作業者が下段から箱を取り出す'),
    A.advance(T, 1.0, '短い傾斜で次の箱が前へ', 'human'),
    A.call(() => W.carry.userData.setEmpty(), '部品を使い切ると空箱になる（時間は省略）', 0.9, 'human'),
    ...workerPlace(W, R, '空箱をユニット上段の返却レーンへ', 1.3),
    A.advance(R, 1.4, '空箱は通路側の出口へ'),
    ...scan(m, () => wp(U.mk), 'ユニットIDマーカー（U-02）を読む → 品番・段・位置を特定'),
    ...verify(m, () => deck[0], '箱のバーコードとユニットの品番を照合', `照合OK：${deck[0].userData.code}`),
    ...transfer(m, deck[0], () => wp(m.g, m.slots[0]), () => T.wpos(T.entryS), toLane(T), { l2: '投入口の手前へ運ぶ', l3: '投入口へ置く' }),
    A.advance(T, 1.2, '箱は列の最後尾へ'),
    ...transfer(m, empty, () => R.wpos(R.sAt(0)), () => wp(m.g, m.slots[0]), toDeck(m, 0), { fromLane: R, fromOut: V3(0, 0.03, 0.25), toApp: V3(0, 0.12, 0.14), l0: '返却出口で空箱をつかむ', l2: '空箱を台車へ運ぶ', l3: '台車に空箱を積む' }),
    A.arm(m, () => m.homeW(), 0.9, '手先を走行姿勢に戻す'),
    A.drive(m, 4.3, 2.6, 'MoMaは次のユニットへ'),
    A.tween(old.g, () => V3(ux(P.units - 1) + 1.15, 0, 0), 1.8, 'レイアウト変更：U-04 のロックを外し、車輪で横へ移動'),
    A.call(() => { nu.g.visible = true; }, '新しい品番のユニット U-05 を用意', 0.7),
    A.tween(nu.g, () => V3(ux(P.units - 1), 0, 0), 2.0, '床の基準板のピンに押し当てるだけで位置が決まる（棚の作り直し不要）'),
    A.wait('次の巡回でMoMaがユニットIDを読み、新しい品番を自動で登録（教え直し不要）', 2.2),
  ];

    cmp: { ease: ['○', '既存棚の改造＋運用'], dens: ['△', '上下段を使わない'], jam: ['△', '傾斜ローラーが残る'], mis: ['○', '人もMoMaも照合'], layout: ['△', '棚は従来どおり固定'], red: ['◎', '同じ口で人が代われる'] } },
];

/* ===================== 画面（タブ・右パネル・比較表） ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage'), panel = $('#panel'), compare = $('#compare');
function setCaption(n, N, t, who) { $('#caption .n').textContent = n ? `手順 ${n}/${N}` : ''; $('#caption .t').textContent = t; $('#caption').classList.toggle('human', who === 'human'); }
function renderWarns() { const el = $('#warns'); if (el) el.innerHTML = [...WARN].map(w => `<div>⚠ ${w}</div>`).join(''); }
const sec = (t, items, cls = '') => `<h3 class="${cls}">${t}</h3><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul>`;
function renderPanel(P) {
  panel.innerHTML = `<h2>${P.tab}<small>${P.sub}</small></h2><p class="lead">${P.lead}</p>
    <div class="kpis">${kpis(P.id).map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <div class="warns" id="warns"></div>
    ${sec('構造の要点（傾斜・段数・位置決め・空箱回収）', P.struct)}${sec('MoMaの投入動作', P.moma)}${sec('人の取り出し側', P.human, 'h')}
    ${sec('前提2の課題のうち解決するもの', P.solves)}${sec('新たに生じる課題・リスク', P.risks, 'r')}${sec('導入しやすさ', P.ease)}
    <div class="check">${sec('実機検証で確かめる点', P.verify)}</div>
    <p class="note">数値はすべて仮値です。ファイル冒頭の CONFIG を変えると、3D・寸法・この欄の数値が変わります。担当間口数の目安の計算は「比較表」タブを参照。</p>`;
  renderWarns(); panel.scrollTop = 0;
}
function renderCompare() {
  const cls = s => ({ '◎': 'a', '○': 'b', '△': 'c', '×': 'd' }[s]);
  const cell = v => `<td><span class="s ${cls(v[0])}">${v[0]}</span>${v[1]}</td>`;
  const cur = { fr: 9, w: 3 * (C.shooter.laneW + 70) };
  const rows = PLANS.map(P => { const s = STATS[P.id](), c = P.cmp;
    return `<tr><th class="plan">${P.tab}</th>${cell(c.ease)}${cell(c.dens)}<td class="num">${f1(s.fr / (s.w / 1000))}</td><td class="num">${f1(s.sku / (s.w / 1000))}</td>${cell(c.jam)}${cell(c.mis)}${cell(c.layout)}${cell(c.red)}<td class="num">${s.mo < 10 ? f1(s.mo) : f0(s.mo)}</td><td class="num">${s.per}${s.kit ? '（台分）' : ''}${s.extra ? `＋予備${s.extra}` : ''}</td><td class="num">${s.sec}</td></tr>`; }).join('');
  compare.innerHTML = `<h2>6案の比較表</h2>
    <p class="note">評価は叩き台としての相対評価です（◎ とても良い・○ 良い・△ 課題あり・× 不向き）。数値はすべて CONFIG の仮値から計算しています。</p>
    <div class="legend2"><span>標準箱 ${C.box.w}×${C.box.d}×${C.box.h}mm・${C.box.kg}kg（仮）</span><span>MoMa 台車 ${C.moma.baseW}×${C.moma.baseL}mm・リーチ${C.moma.armReach}mm・可搬${C.moma.payloadKg}kg・最大${C.moma.maxBoxes}箱/巡回（仮）</span></div>
    <div style="overflow-x:auto"><table class="cmp"><thead><tr>
      <th>案</th><th>導入しやすさ</th><th>間口密度（評価）</th><th class="num">間口密度<br>（間口/棚幅1m・仮）</th><th class="num">供給できる品番の密度<br>（品番/棚幅1m・仮）</th>
      <th>詰まりにくさ</th><th>誤投入防止</th><th>レイアウト変更の軽さ</th><th>停止時の冗長性</th>
      <th class="num">MoMa 1台あたりの担当間口数の目安<br>（間口/台・仮）</th><th class="num">ラインサイド在庫<br>（箱/間口・仮）</th><th class="num">1箱の補充時間<br>（秒/箱・仮）</th></tr></thead>
    <tbody><tr class="base"><th class="plan">参考：現行（人が補充）</th><td>—</td><td>基準</td><td class="num">${f1(cur.fr / (cur.w / 1000))}</td><td class="num">${f1(cur.fr / (cur.w / 1000))}</td><td><span class="s c">△</span>傾斜ローラー</td><td><span class="s c">△</span>目視のみ</td><td><span class="s c">△</span>作り直し</td><td>—</td><td class="num">—</td><td class="num">${capOf(1500, 4, C.box.d)}</td><td class="num">—</td></tr>${rows}</tbody></table></div>
    <h3 style="font-size:14px;margin:18px 0 4px">担当間口数の目安の計算（仮）</h3>
    <p class="note" style="font-size:13px;line-height:1.8">担当間口数（間口/台）＝ 稼働率 ${E.utilization * 100}%（仮）× 3600秒 ÷（1間口あたりの消費 ${E.boxesPerLanePerHour}箱/時（仮）× 1箱の補充時間 秒/箱（仮））<br>
    ⑤順序供給型は、1間口の消費をライン速度 ${C.plans.p5.kitsPerHour}台/時（仮）として計算しています。つまり「工程数/台」の意味です。<br>
    1箱の補充時間には、走行・マーカー読取・照合・空箱回収を含め、1巡回${C.moma.maxBoxes}箱で割った値を仮に置いています。実測で置き換えてください。</p>
    <h3 style="font-size:14px;margin:18px 0 4px">読み方</h3>
    <ul class="note" style="font-size:13px;line-height:1.8"><li>最初の1ラインには ①現行改良型（後付け）が入れやすく、⑥人・ロボット兼用型の表示灯と切替手順を足すと停止時も安心です。</li>
    <li>詰まりの多い工程は ②フラット押し込み型、多品種で間口が足りない工程は ③高密度型 か ⑤順序供給型 が候補です。</li>
    <li>レイアウト変更が多い工場は ④可搬モジュール型 のユニット外寸・基準板・IDマーカーを標準インターフェースとして先に決めておくと、他の案にも流用できます。</li></ul>`;
}

/* ===================== 3D表示と再生 ===================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, labelLayer);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffffff');
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight('#ffffff', '#dfe6ec', 0.72));
const sun = new THREE.DirectionalLight('#ffffff', 0.72); sun.position.set(3, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 }); sun.shadow.bias = -0.0006; scene.add(sun);
const fillL = new THREE.DirectionalLight('#ffffff', 0.28); fillL.position.set(-4, 3, -4); scene.add(fillL);
const orbit = new Orbit(cam, renderer.domElement);
let cur = 0, plan = null, tline = null, playing = true, speed = 1, endWait = 0, cmpMode = false;
function loadPlan(i, fresh) {
  if (ROOT) { scene.remove(ROOT); ROOT.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  LABELS.forEach(l => l.el.remove()); LABELS = []; DIMS = [];
  if (fresh) WARN = new Set();
  ROOT = new THREE.Group(); scene.add(ROOT);
  plan = PLANS[i].build(ROOT); tline = new Timeline(plan.steps); endWait = 0;
  const p = plan.center; sun.position.set(p.x + 3, 7, p.z + 4); sun.target.position.copy(p); sun.target.updateMatrixWorld();
  applyDimVis();
  if (fresh) { renderPanel(PLANS[i]); setView('side'); }
  setCaption(0, 0, playing ? '' : '「▶ 再生」でMoMaの投入動作を表示します');
}
function setView(v) {
  const t = plan.center, f = plan.span * (cam.aspect < 1 ? 1.7 : cam.aspect < 1.3 ? 1.25 : 1);
  const off = { side: V3(6.0 * f, 2.7, 1.3 * f), aisle: V3(2.0 * f, 2.4, 5.8 * f), line: V3(-2.0 * f, 1.9, -5.4 * f), top: V3(0.01, 8.0 * f, 1.0) }[v];
  orbit.set(t.clone().add(off), t);
}
function applyDimVis() { const on = $('#chkDim').checked; DIMS.forEach(d => d.visible = on); }
function setPlay(p) { playing = p; $('#btnPlay').textContent = p ? '■ 停止' : '▶ 再生'; }
function resize() { const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return; renderer.setSize(r.width, r.height); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
function selectTab(i) {
  document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === i)));
  cmpMode = i === PLANS.length;
  stage.hidden = panel.hidden = cmpMode; compare.hidden = !cmpMode;
  if (cmpMode) { renderCompare(); return; }
  cur = i; resize(); loadPlan(i, true);
  try { history.replaceState(null, '', '#' + PLANS[i].id); } catch (e) { }
}
const tabs = $('#tabs');
[...PLANS.map(P => P.tab), '比較表（6案）'].forEach((t, i) => { const b = document.createElement('button'); b.className = 'tab' + (i === PLANS.length ? ' cmp' : ''); b.textContent = t; b.setAttribute('role', 'tab'); b.onclick = () => selectTab(i); tabs.appendChild(b); });
$('#btnPlay').onclick = () => { setPlay(!playing); if (playing && tline.done) loadPlan(cur, false); };
$('#btnRestart').onclick = () => { loadPlan(cur, false); };
$('#selSpeed').onchange = e => speed = +e.target.value;
$('#chkDim').onchange = applyDimVis;
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  if (cmpMode || !plan) return;
  if (playing) {
    if (!tline.done) tline.update(dt * speed);
    else { endWait += dt * speed; if (endWait > 1.6) loadPlan(cur, false); }
  }
  renderer.render(scene, cam);
  const r = renderer.domElement; updateLabels(cam, r.clientWidth, r.clientHeight);
}
const start = Math.max(0, PLANS.findIndex(P => '#' + P.id === location.hash));
selectTab(location.hash === '#compare' ? PLANS.length : start);
if (location.hash === '#compare') { cur = 0; }
frame();
window.__app = { PLANS, loadPlan, selectTab, get tline() { return tline; }, get warns() { return [...WARN]; }, setPlay, setView };
</script>
</body>
</html>
