      A.arm(m, () => Wr(c().add(V3(0, 0.004, 0))), 0.8, '天面に下ろす'),

    const pt = pts.map(o => `<circle cx="${X(o.v)}" cy="${Y(o.z)}" r="5" fill="${o.c || '#c2357a'}" stroke="#fff" stroke-width="1.5"/>`).join('');
    return `<div style="flex:1 1 460px;min-width:420px"><h3 style="font-size:13.5px;margin:6px 0 2px">${title}</h3><svg viewBox="0 0 ${W} ${H + 24}" style="width:100%;background:#fff">${tx}${ty}${br}
      <rect x="${x0}" y="${Y(C.shooter.pickHmax)}" width="${w}" height="${Y(C.shooter.pickHmin) - Y(C.shooter.pickHmax)}" fill="#3EB370" opacity=".06"/>${extra(X, Y, x0, y0, w, h)}${ln}${pt}
      <text x="${x0 + w / 2}" y="${H + 18}" font-size="11.5" text-anchor="middle" fill="#1d2a33">${xlab}</text>
      <text x="14" y="${y0 + h / 2}" font-size="11.5" fill="#1d2a33" transform="rotate(-90 14 ${y0 + h / 2})" text-anchor="middle">箱の中心の高さ mm</text></svg></div>`;
  };
  const sidePts = ST.map(st => ({ v: Math.abs(st.dx) * 1000, z: st.zc, c: st.zc < C.shooter.pickHmin + 400 ? '#c2357a' : '#0b4f8a' }));
  const g1 = chart('① 棚に最も近く止まったとき（すき間' + C.moma.clearance + 'mm）：左右にずらす量', [0, 900], [0, 150, 300, 450, 600, 750, 900], '箱の中心から、車体の中心までの左右のずれ mm',
    REACH.side, sidePts, () => '');
  const g2 = chart('② 列の正面に止まる場合（参考）：棚から離れる距離', [400, 1150], [400, 500, 600, 700, 800, 900, 1000, 1100], '棚の通路側の面から、アームの肩（車体の中心）まで mm',
    REACH.rows, lv.map(o => ({ v: o.F, z: o.zc, c: o.c })),
    (X, Y, x0, y0, w, h) => `<line x1="${X(near)}" x2="${X(near)}" y1="${y0}" y2="${y0 + h}" stroke="#555" stroke-dasharray="4 3"/><text x="${X(near) + 4}" y="${y0 + 12}" font-size="10.5" fill="#555">最も近い停止</text>`);
  const rows = ST.map(st => `<tr><th class="plan">${st.name}</th><td class="num">${Math.round(st.zc)}</td><td class="num">${Math.abs(st.dx) > 0.01 ? `横に ${Math.round(Math.abs(st.dx) * 1000)}` : '正面'}</td><td class="num">${Math.round(st.F * 1000 - C.moma.baseW / 2)}</td><td class="num">${Math.round(st.del * 1000)}</td><td class="num">${Math.round((st.del - (st.pull || 0)) * 1000)}／${Math.round((st.pull || 0) * 1000)}</td></tr>`).join('');
  const cl = V.total;
  compare.innerHTML = `<h2>高さの使い方（アームの届く範囲と、当たらない停止位置）</h2>
    <p class="note">MoMaが ${P.mainType}（部品入り${REACH.kg}kg・仮）をフック式ハンドで水平に持ち、棚の通路側の面に出し入れできる範囲です。青い帯は CAD（reach.py）の計算、点は 3D の動作で使った停止位置（動作の全コマで干渉を確認したもの）。①で点が帯の左にあるのは、3D の確認のほうがハンドの形（胴と爪の板）を細かく見ているため。CAD の帯は安全側の目安。</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px;max-width:1100px">${g1}${g2}</div>
    <h3 style="font-size:14px;margin:18px 0 4px">何が高さと停止位置を決めているか</h3>
    <ul class="note" style="font-size:13px;line-height:1.8">
      <li><b>MoMaは2輪駆動で横に動けない</b>：通路を走って止まり、その場で90°旋回して棚に向き直る。棚への出し入れは前進・後退だけで行う。</li>
      <li><b>低い段は、列の正面から横にずれた位置で棚に向いて止まる</b>：箱を水平に端面で持つと、手首は箱の端面から手前に約${C.moma.wrist + C.moma.gripLen}mm。列の正面に止まると手首が車体の真上に来て、車体まわり${C.moma.keepOut}mmの進入禁止域に入る。${ST.length ? Math.round(Math.abs(ST[0].dx) * 1000) : 550}mm ほど横に止まると、手首と腕が車体の横に出るので、棚に近いまま（すき間${C.moma.clearance}mm）低い段を扱える。①の帯の左端より右に止まればよい。</li>
      <li><b>下限 ${Math.round(momaCenterMin())}mm</b>：詳細仕様のリーチは0.25mだが、爪を取っ手穴の下から掛けに行く（10mm下がる）とき、上腕が車体の進入禁止域に入らない高さ。これより低いと横にずれて止まっても上腕が車体の角に当たる。</li>
      <li><b>上限 ${Math.round(momaCenterMax())}mm</b>：腕（上腕＋前腕）を伸ばし切らない範囲（98%）で、出口ストッパーを越えるための持ち上げ ${P.hookLift}mm を含む。高い段は列の正面で、棚に近く止まる。</li>
      <li><b>出し入れは手と足のシンクロ動作で</b>：約${ST.length ? Math.round(ST[0].del * 1000) : 550}mm の出し入れを、前進・後退と腕の伸び縮みで同時に分担する。台車と手首を同じ進み方で動かすので、箱は棚の中をまっすぐ動き、上の段の下側や柱に当たらない。腕が受け持つ量は、腕と持った箱・車体が当たらない範囲で段ごとに決めた（下の表）。旋回は棚から十分下がり、手先を走行姿勢にしてから行う（車体・天面の箱が棚に当たらないことも確認）。</li>
      <li><b>天面の箱</b>：アームの肩（J2）は天面から${C.moma.j2H}mm。2段に積んだ箱はこれより高いので、2段あるうちはアームを棚の正面に向けない（車体の後ろ側を回して手を伸ばす）。箱を持って肩の前を回るときは肩より高く持ち上げ、ひじが箱の上に来ないようにする。</li>
      <li><b>手首の負荷</b>：箱の重心が手首から離れるほど負荷が増える（許容 ${C.moma.j5Moment}Nm）。${P.mainType} は部品入り約${Math.floor((C.moma.j5Moment / 9.81 - 2 * 0.24) / ((C.moma.wrist + C.moma.gripLen + 251.5) / 1000))}kgまで。長物 TP-391.5B は約${Math.floor((C.moma.j5Moment / 9.81 - 2 * 0.24) / ((C.moma.wrist + C.moma.gripLen + 502.5) / 1000))}kgまで。</li></ul>
    <h3 style="font-size:14px;margin:18px 0 4px">3Dの動作で使った停止位置</h3>
    <table class="cmp" style="min-width:560px"><thead><tr><th>扱う間口</th><th class="num">箱の中心の高さ（mm）</th><th class="num">左右のずらし（mm）</th><th class="num">棚の面と車体のすき間（mm）</th><th class="num">出し入れの前後移動（mm）</th><th class="num">うち台車／腕（mm）</th></tr></thead><tbody>${rows}</tbody></table>
    <h3 style="font-size:14px;margin:18px 0 4px">干渉の確認（3Dの動作の全コマ）</h3>
    <ul class="note" style="font-size:13px;line-height:1.8">
      <li>上腕・前腕・手首（太さ ${C.moma.linkR.join('・')}mm の円柱）、ハンドの胴と爪の板（箱）、持った箱 が、車体＋進入禁止域${C.moma.keepOut}mm・天面の箱・床・棚に当たらないこと。</li>
      <li>棚の中に入ってよいのは、ハンドと持った箱だけで、その間口の空間（置き面〜上の段の下側。傾きも含む）の中だけ。上腕・前腕は持った箱にも当たらないこと。</li>
      <li>持った箱は天面の箱置きに置くため、進入禁止域ではなく車体そのものと10mm以上離す。</li>
      <li>結果（${V.frames}コマ）：${V.hits.length ? `<b style="color:#b02a2a">${V.hits.length}か所で干渉</b>：${V.hits.map(h => `「${h.label}」${h.hit}`).join('、')}` : '<b style="color:#1f6b42">干渉なし</b>'}。最小すき間 ${isFinite(cl) ? Math.round(cl * 1000) : '—'}mm（天面に積んだ2箱の上の箱を持ち上げ始める瞬間。TP箱は積むと8mm入り込む分を除く）。</li></ul>`;
}

/* ===================== 3D表示と再生 ===================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, labelLayer);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffffff');
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight('#ffffff', '#dfe6ec', 0.72));
const sun = new THREE.DirectionalLight('#ffffff', 0.72); sun.position.set(3, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 }); sun.shadow.bias = -0.0006; scene.add(sun);
const fillL = new THREE.DirectionalLight('#ffffff', 0.28); fillL.position.set(-4, 3, -4); scene.add(fillL);
const orbit = new Orbit(cam, renderer.domElement);
let cur = 0, plan = null, tline = null, playing = true, speed = 1, endWait = 0, cmpMode = false;
const EXTRA = [['予備在庫の回し方', () => renderCycle()], ['高さの使い方', () => renderReach()], ['収納の比較', () => renderCompare()]];
function loadPlan(i, fresh) {
  if (ROOT) { scene.remove(ROOT); ROOT.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  LABELS.forEach(l => l.el.remove()); LABELS = []; DIMS = [];
  if (fresh) WARN = new Set();
  if (!VERIFY) {   // 見えない場所で全手順を1/60秒刻みで動かし、干渉を確認しておく（右パネル・「高さの使い方」に表示）
    const t0 = performance.now(); ROOT = new THREE.Group(); const vp = PLANS[i].build(ROOT), vt = new Timeline(vp.steps); let n = 0;
    while (!vt.done && n < 200000) { vt.update(1 / 60); n++; }
    VERIFY = { hits: COLL.hits.slice(), total: COLL.total, frames: n, ms: Math.round(performance.now() - t0), stances: window.__stances };
    ROOT.traverse(o => { if (o.geometry) o.geometry.dispose(); }); LABELS.forEach(l => l.el.remove()); LABELS = []; DIMS = [];
  }
  ROOT = new THREE.Group(); scene.add(ROOT);
  plan = PLANS[i].build(ROOT); tline = new Timeline(plan.steps); endWait = 0;
  const p = plan.center; sun.position.set(p.x + 3, 7, p.z + 4); sun.target.position.copy(p); sun.target.updateMatrixWorld();
  applyDimVis();
  if (fresh) { renderPanel(PLANS[i]); setView('side'); }
  setCaption(0, 0, playing ? '' : '「▶ 再生」でMoMaの投入動作を表示します');
}
function setView(v) {
  const t = plan.center, f = plan.span * (cam.aspect < 1 ? 1.7 : cam.aspect < 1.3 ? 1.25 : 1);
  const off = { side: V3(6.0 * f, 2.7, 1.3 * f), aisle: V3(2.0 * f, 2.4, 5.8 * f), line: V3(-2.0 * f, 1.9, -5.4 * f), top: V3(0.01, 8.0 * f, 1.0) }[v];
  orbit.set(t.clone().add(off), t);
}
function applyDimVis() { const on = $('#chkDim').checked; DIMS.forEach(d => d.visible = on); }
function setPlay(p) { playing = p; $('#btnPlay').textContent = p ? '■ 停止' : '▶ 再生'; }
function resize() { const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return; renderer.setSize(r.width, r.height); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
function selectTab(i) {
  document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === i)));
  cmpMode = i >= PLANS.length; clearInterval(cycleTimer); cycleTimer = null;
  stage.hidden = panel.hidden = cmpMode; compare.hidden = !cmpMode;
  if (cmpMode) { EXTRA[i - PLANS.length][1](); return; }
  cur = i; resize(); loadPlan(i, true);
  try { history.replaceState(null, '', '#' + PLANS[i].id); } catch (e) { }
}
const tabs = $('#tabs');
[...PLANS.map(P => P.tab), ...EXTRA.map(e => e[0])].forEach((t, i) => { const b = document.createElement('button'); b.className = 'tab' + (i >= PLANS.length ? ' cmp' : ''); b.textContent = t; b.setAttribute('role', 'tab'); b.onclick = () => selectTab(i); tabs.appendChild(b); });
$('#btnPlay').onclick = () => { setPlay(!playing); if (playing && tline.done) loadPlan(cur, false); };
$('#btnRestart').onclick = () => { loadPlan(cur, false); };
$('#selSpeed').onchange = e => speed = +e.target.value;
$('#chkDim').onchange = applyDimVis;
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  if (cmpMode || !plan) return;
  if (playing) {
    if (!tline.done) tline.update(dt * speed);
    else { endWait += dt * speed; if (endWait > 1.6) loadPlan(cur, false); }
  }
  renderer.render(scene, cam);
  const r = renderer.domElement; updateLabels(cam, r.clientWidth, r.clientHeight);
}
const start = Math.max(0, PLANS.findIndex(P => '#' + P.id === location.hash));
selectTab(location.hash === '#cycle' ? PLANS.length : location.hash === '#reach' ? PLANS.length + 1 : location.hash === '#compare' ? PLANS.length + 2 : start);
if (location.hash === '#compare') { cur = 0; }
frame();
window.__orbit = orbit; window.__app = { PLANS, loadPlan, selectTab, get tline() { return tline; }, get warns() { return [...WARN]; }, setPlay, setView };
</script>
