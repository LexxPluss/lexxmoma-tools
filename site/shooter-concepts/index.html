<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シューター本案（縦型省スペース）</title>
<meta name="description" content="TP規格コンテナを使うラインサイドのシューター（部品供給棚）の本案。同じ箱数を従来の約7割の床面積で持つ縦型省スペース型を3Dで確認する。">
<script>
/* =====================================================================
   CONFIG（config.js 相当）
   本案「縦型省スペース型」の寸法と隙間のルール。CAD（cad/shooter-space/params.py）と同じ値・同じ計算で
   段の高さを決める。数値を変えて再読み込みすると、3D・寸法・右パネル・比較表がまとめて変わる。
   単位は mm / kg / 秒。出典のない値は仮値。
   ===================================================================== */
const CONFIG = {
  moma: {
    baseW: 700, baseL: 1000, baseH: 400,   // 走行台車（仮）
    aisleTurn: 1500,                       // 旋回に必要な通路幅（仮）
    armReach: 1300, payloadKg: 10,         // アーム（仮）
    toolLen: 150,                          // 手首から手先まで（仮）
    maxBoxes: 4,                           // 1回の巡回で積める箱数（仮）
    clearance: 150,                        // 棚の通路側の面と台車のすき間（仮）
  },
  shooter: { pickHmin: 700, pickHmax: 1500 },   // 取り出し段：置き面の下限・箱の上端の上限（仮）
  box: { gap: 10 },                              // 奥行き方向の箱どうしの隙間
  worker: { height: 1700 },
  line: { zoneDepth: 1500 },
  estimate: { utilization: 0.75, boxesPerLanePerHour: 1.5 },   // 担当間口数の目安の計算用（仮）
  // TP規格コンテナ（岐阜プラスチック工業の掲載寸法・外寸）。底面は 167.5mm のモジュールの倍数
  tp: {
    module: 167.5,
    types: {
      'TP-331.5B': { L: 335, W: 335, H: 149, liter: 11 },
      'TP-341.5B': { L: 503, W: 335, H: 149, liter: 17 },
      'TP-391.5B': { L: 1005, W: 335, H: 149, liter: 35 },
    },
    fullKg: 9,   // 部品入りの重さの想定（仮）
  },
  plan: {
    mainType: 'TP-341.5B',
    nBox: 36,                     // 置きたい箱の総数（同じコンテナ量）
    cols: 4, deep: 2,             // 4列、取り出し段は奥に2箱
    levels: ['reserve', 'reserve', 'pick', 'pick', 'pick', 'return'],   // 下から順
    mix: { '1-2': 'TP-391.5B', '2-3': 'TP-331.5B' },                    // 「列-段」ごとの箱（段は下から0始まり）
    pipeD: 28,                    // Φ28パイプ（イレクター相当・掲載値）
    structBelow: 54,              // 置き面から下の構造：ローラーレール26（仮）＋受けパイプ28
    sideClear: 10,                // 箱とガイドの片側の隙間（仮）
    stopOff: 15, rearClear: 40,   // 前端ストッパーの厚さ、通路側の入れ口の余裕（仮）
    slopePct: 4,                  // ローラーの自走勾配（仮）
    floorMin: 120,                // 最下段の置き面（仮）
    panel: 5,                     // ライン側の閉じ板の厚さ
    gap: {                        // 段の上の空き [ライン側, 通路側]（仮）
      pick: [100, 60],            // ライン側：手を入れて部品を取る / 通路側：箱を入れる
      return: [60, 60],
      reserve: [20, 60],
    },
    secPerBox: 60,                // 1箱の補充時間（走行込み・仮）
    // 比較：同じ規則で作った A 従来型・B 帯の中だけで縮める
    compare: [
      { key: 'A', title: 'A 従来型：傾斜ローラー 4列×3段×奥3箱', cols: 4, deep: 3, levels: ['pick', 'pick', 'pick', 'return'] },
      { key: 'B', title: 'B 帯の中だけで奥行きを縮める：6列×3段×奥2箱', cols: 6, deep: 2, levels: ['pick', 'pick', 'pick', 'return'] },
    ],
  },
  colors: {
    blue: '#0068B7', green: '#3EB370', retro: '#5AA0DC', frame: '#D9D3C0', roller: '#C5CDD3',
    powered: '#8FA9BF', plate: '#EEF2F5', empty: '#CDD5DB', dim: '#4F6575', floor: '#F7F9FA',
    sku: ['#2F6FB3', '#3D7FC4', '#285F9C', '#4A8ACB', '#22558C', '#3570B0'],
    tp: { 'TP-341.5B': '#2F6FB3', 'TP-331.5B': '#3C9A5F', 'TP-391.5B': '#E58F26' },
  },
};
</script>
<style>

<header>

  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main">
  <section id="stage">
    <div id="labels"></div>

      <div><i style="background:#2F6FB3"></i>TP-341.5B（503×335×149）</div><div><i style="background:#E58F26"></i>TP-391.5B（長さ1005）</div><div><i style="background:#3C9A5F"></i>TP-331.5B（335角）</div>
      <div><i style="background:#CDD5DB"></i>空箱</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ===================== 基本ユーティリティ ===================== */
const C = CONFIG, COL = CONFIG.colors;
const M = v => v / 1000;                      // mm → m（3D空間は 1単位 = 1m）
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const mm = v => Math.round(v * 1000);         // m → mm 表示
const shade = (hex, amt) => { const c = new THREE.Color(hex); c.lerp(new THREE.Color(amt > 0 ? '#ffffff' : '#000000'), Math.abs(amt)); return '#' + c.getHexString(); };
const _mc = {};
function mat(color, o = {}) { const k = color + JSON.stringify(o); return _mc[k] || (_mc[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.72, metalness: 0.05 }, o))); }
function mesh(geo, m, shadow = true) { const x = new THREE.Mesh(geo, m); x.castShadow = shadow; x.receiveShadow = true; return x; }
function addBox(parent, sx, sy, sz, color, x, y, z, o = {}) {
  const b = mesh(new THREE.BoxGeometry(sx, sy, sz), typeof color === 'string' ? mat(color, o.m || {}) : color);
  b.position.set(x, y, z); if (o.rx) b.rotation.x = o.rx; if (o.ry) b.rotation.y = o.ry; parent.add(b); return b;
}
const FONT = '"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","IPAGothic",sans-serif';
const _tc = {};
function textTex(lines, o = {}) {
  const key = JSON.stringify([lines, o]); if (_tc[key]) return _tc[key];
  const w = o.w || 256, h = o.h || 128, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = o.bg || '#fff'; g.fillRect(0, 0, w, h);
  if (o.border) { g.strokeStyle = o.border; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8); }
  const fs = o.font || 34, top = o.bars ? h * 0.34 : h / 2;
  g.fillStyle = o.fg || '#1d2a33'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 ${fs}px ${FONT}`;
  lines.forEach((s, i) => g.fillText(s, w / 2, top + (i - (lines.length - 1) / 2) * fs * 1.18));
  if (o.bars) {                                 // バーコード風の模様（文字列から決まる）
    g.fillStyle = '#fff'; g.fillRect(w * 0.18, h * 0.6, w * 0.64, h * 0.32);
    let seed = 0; for (const ch of lines.join('')) seed = (seed * 31 + ch.charCodeAt(0)) % 9973;
    g.fillStyle = '#111'; let x = w * 0.2;
    while (x < w * 0.8) { seed = (seed * 73 + 41) % 9973; const bw = 1 + seed % 4; g.fillRect(x, h * 0.63, bw, h * 0.26); x += bw + 1 + (seed >> 3) % 3; }
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return (_tc[key] = t);
}
function texMat(lines, o) { const k = 'T' + JSON.stringify([lines, o]); return _mc[k] || (_mc[k] = new THREE.MeshStandardMaterial({ map: textTex(lines, o), roughness: 0.8 })); }
function plane(parent, w, h, m, x, y, z, ry = 0) { const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.rotation.y = ry; parent.add(p); return p; }

/* ===================== 視点操作（OrbitControls 相当・自作） ===================== */
class Orbit {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom; this.target = V3(); this.r = 6; this.th = 0.8; this.ph = 1.0;
    this.ptr = new Map(); this.onChange = null;
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('pointerdown', e => { dom.setPointerCapture(e.pointerId); this.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button, s: e.shiftKey || e.ctrlKey || e.metaKey }); });
    dom.addEventListener('pointermove', e => this.move(e));
    const up = e => { this.ptr.delete(e.pointerId); this.pinch = null; };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e => { e.preventDefault(); this.zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });
  }
  set(pos, target) {
    this.target.copy(target); const d = pos.clone().sub(target);
    this.r = d.length(); this.ph = Math.acos(clamp(d.y / this.r, -1, 1)); this.th = Math.atan2(d.x, d.z); this.update();
  }
  zoom(f) { this.r = clamp(this.r * f, 1.2, 30); this.update(); }
  pan(dx, dy) {
    const s = this.r * 0.0016, cam = this.cam;
    const right = V3().setFromMatrixColumn(cam.matrix, 0), upv = V3().setFromMatrixColumn(cam.matrix, 1);
    this.target.addScaledVector(right, -dx * s).addScaledVector(upv, dy * s); this.update();
  }
  move(e) {
    const p = this.ptr.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (this.ptr.size === 2) {
      const [a, b] = [...this.ptr.values()]; p.x = e.clientX; p.y = e.clientY;
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (this.pinch) { this.zoom(this.pinch.d / dist); this.pan(mid.x - this.pinch.m.x, mid.y - this.pinch.m.y); }
      this.pinch = { d: dist, m: mid }; return;
    }
    p.x = e.clientX; p.y = e.clientY;
    if (p.b === 2 || p.b === 1 || p.s) this.pan(dx, dy);
    else { this.th -= dx * 0.006; this.ph = clamp(this.ph - dy * 0.006, 0.08, Math.PI / 2 - 0.02); this.update(); }
  }
  update() {
    const s = Math.sin(this.ph);
    this.cam.position.set(this.target.x + this.r * s * Math.sin(this.th), this.target.y + this.r * Math.cos(this.ph), this.target.z + this.r * s * Math.cos(this.th));
    this.cam.lookAt(this.target); this.cam.updateMatrixWorld();
  }
}

/* ===================== 部位ラベル・寸法線 ===================== */
let LABELS = [], DIMS = [], ROOT = null;
const labelLayer = document.getElementById('labels');
function label(target, html, kind = '', off = V3()) {
  const el = document.createElement('div'); el.className = 'lbl ' + kind; el.innerHTML = html; labelLayer.appendChild(el);
  const L = { el, target, off, kind }; LABELS.push(L); return L;
}
function unlabel(L) { if (!L) return; L.el.remove(); LABELS = LABELS.filter(x => x !== L); }
function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
const _pv = V3();
function updateLabels(cam, w, h) {
  const showL = document.getElementById('chkLbl').checked, showD = document.getElementById('chkDim').checked;
  const fixed = [], movable = [];
  for (const L of LABELS) {
    const isDim = L.kind.includes('dim'), isFlash = L.kind.includes('flash') || L.kind.includes('warn');
    let show = isDim ? showD : (showL || isFlash);
    if (L.target.isObject3D) { if (!visibleChain(L.target)) show = false; _pv.copy(L.off); L.target.localToWorld(_pv); }
    else _pv.copy(L.target);

    ...transfer(m, empty, () => R.wpos(R.sAt(0)), () => wp(m.g, m.slots[0]), toDeck(m, 0), { fromLane: R, fromOut: V3(0, 0.03, 0.25), toApp: V3(0, 0.12, 0.14), l0: `返却段の通路側の出口（${Lo.ret.zb}mm）で空箱をつかむ`, l2: '空箱を台車へ運ぶ', l3: '台車に空箱を積む（かんばん回収）' }),
    A.arm(m, () => m.homeW(), 0.9, '手先を走行姿勢に戻す'),
    A.drive(m, 4.3, 2.8, 'MoMaは次の棚へ'),
  ];
  return { steps, center: V3(0, 0.95, D / 2 + 0.3), span: Math.max(0.85, M(Lo.width) / 2.2) };
}

/* ===================== 数値・右パネル ===================== */
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
function kpis() {
  const Lo = layout(mainSpec()), A0 = layout(C.plan.compare[0]), E = C.estimate;
  const mo = E.utilization * 3600 / (E.boxesPerLanePerHour * C.plan.secPerBox);
  return [
    [`${Lo.area.toFixed(2)} m²`, `棚の床面積（A 従来型 ${A0.area.toFixed(2)} m² の ${Math.round(Lo.area / A0.area * 100)}%）`],
    [`${Lo.areaAisle.toFixed(2)} m²`, `通路${C.moma.aisleTurn}mm込み（A の ${Math.round(Lo.areaAisle / A0.areaAisle * 100)}%）`],
    [`${Math.round(Lo.width)}×${Math.round(Lo.depth)}×${Math.round(Lo.height)}`, '外形 幅×奥行き×高さ（mm）'],
    [`${Lo.boxes} 箱`, `収納（最大 ${Lo.capacity} 箱）・${Lo.sku} 品番`],
    [`${Lo.picks[0].zf}〜${Lo.openTop} mm`, '取り出し段（置き面の下限〜箱の上端）'],
    [`${Math.floor(mo)} 間口/台`, `MoMa 1台の担当間口数の目安（${C.plan.secPerBox}秒/箱・仮）`],

}
function planText() {
  const P = C.plan, Lo = layout(mainSpec()), A0 = layout(P.compare[0]), lv = Lo.lv;

    id: 'main', tab: '本案：縦型省スペース型', build: buildMain,

        `段の置き面：予備在庫 ${rz}mm／取り出し ${pkz}mm（ライン側）／空箱返却 ライン側 ${Lo.ret.zf}・通路側 ${Lo.ret.zb}mm。`,
        `奥行き ${Math.round(Lo.D)}mm（ストッパー${P.stopOff}＋箱2個＋入れ口${P.rearClear}）。同じ奥行きに TP-391.5B（長さ1005）は1箱、TP-331.5B は3箱入る。`,
        `間口ピッチ ${Lo.pitch}mm（箱幅335＋隙間${P.sideClear}×2＋Φ28ガイド）。取り出し段は勾配${P.slopePct}%の傾斜ローラーで、次の箱が自然に手前へ来る。`,
        'ライン側は取り出し段より下を閉じ板でふさぐ。予備在庫は通路側からだけ出し入れする。']],
      ['寸法の決め方（CADと共通）', [
        `段の上の空きを段の種類で決め、下の段から最小の高さで積む。取り出し段の上はライン側${P.gap.pick[0]}mm（手を入れて部品を取る）・通路側${P.gap.pick[1]}mm、予備在庫段は${P.gap.reserve[0]}・${P.gap.reserve[1]}mm（仮）。`,
        `取り出し段は置き面${C.shooter.pickHmin}mm以上・箱の上端${C.shooter.pickHmax}mm以下。この条件で入るのは${Lo.picks.length}段（空きを60mmに詰めても4段目は入らない）。`,
        '人の取り出し域の中だけで奥行きを縮めても列が増えるだけで床は減らない（比較タブのB）。床が減るのは取り出し域の外（足元）を在庫に使ったとき。']],
      ['MoMaの投入動作', [
        '棚の中央に1回停止し、左右のマーカーで全間口と予備段の位置を計算する。',
        '空いた取り出し段へ、足元の予備在庫段から同じ品番を移す（台車の往復なしで手元が2箱に戻る）。台車の箱で予備在庫段を補充する。',
        '空箱は返却段の通路側の出口から取って台車に積む。'], ''],
      ['人の取り出し側', [
        `取り出しは ${Lo.picks[0].zf}〜${Lo.openTop}mm の3段だけ。足元の予備段には触れない（閉じ板）。`,
        `空箱は最上段の返却段（ライン側 ${Lo.ret.zf}mm）へ置く。軽いが置く高さとしては高い（課題）。`], 'h'],
      ['課題・リスク', [
        `空箱返却段のライン側の置き面が ${Lo.ret.zf}mm と高い。取り出し段の1段を返却に回す・別の返却口を設けるなどの配置を比べる。`,

        'ローラーレールの寸法・自走勾配・手を入れる空きは仮値。とくに手の空きは段数を決める値。'], 'r'],
      ['実機で確かめる点', [

        `部品入りTP箱が勾配${P.slopePct}%のローラーで止まらず流れ、前端で暴れないか`,
        `足元の予備段（${rz}mm）でMoMaが箱をつかめるか（リーチ・姿勢・アームと床の干渉）と、1箱あたりの動作時間`], 'check'],
    ],
  };
}
const PLANS = [planText()];
function renderPanel(P) {
  panel.innerHTML = `<h2>${P.tab}<small>${P.sub}</small></h2><p class="lead">${P.lead}</p>
    <div class="kpis">${kpis().map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <div class="warns" id="warns"></div>
    ${P.sections.map(([t, items, cls]) => cls === 'check' ? `<div class="check">${sec(t, items)}</div>` : sec(t, items, cls || '')).join('')}
    <p class="note">CAD一式（STEP・寸法図・部材表）はリポジトリの cad/shooter-space にあります。数値は仮値を含みます。ファイル冒頭の CONFIG を変えると、3D・寸法・この欄・比較タブが変わります。</p>`;
  renderWarns(); panel.scrollTop = 0;
}
function renderCompare() {
  const P = C.plan, rows = [...P.compare.map(s => [s.title, layout(s)]), [`本案 縦型省スペース：${P.cols}列×${P.levels.filter(k => k === 'pick').length}段×奥${P.deep}箱＋足元の予備段`, layout(mainSpec())]];
  const A0 = rows[0][1];
  const tr = ([t, L], i) => `<tr${i === rows.length - 1 ? ' style="font-weight:700"' : ''}><th class="plan">${t}</th><td class="num">${Math.round(L.width).toLocaleString()}×${Math.round(L.depth).toLocaleString()}×${Math.round(L.height).toLocaleString()}</td>
    <td class="num">${L.area.toFixed(2)}</td><td class="num">${Math.round(L.area / A0.area * 100)}%</td><td class="num">${L.areaAisle.toFixed(2)}</td><td class="num">${L.boxes}（最大${L.capacity}）</td><td class="num">${L.sku}</td><td class="num">${f1(L.boxes / L.area)}</td>
    <td class="num">${L.picks[0].zf}〜${L.openTop}</td><td class="num">${L.ret.zf}</td></tr>`;
  compare.innerHTML = `<h2>床面積の比較（同じ${P.nBox}箱・${P.mainType}）</h2>
    <p class="note">3案とも同じ規則（段の上の空き・勾配・隙間）で段を積んで計算しています。CAD（cad/shooter-space）の結果と同じ値になります。数値は仮値を含みます。</p>
    <div style="overflow-x:auto"><table class="cmp" style="min-width:1050px"><thead><tr><th>案</th><th class="num">外形 幅×奥行き×高さ（mm）</th><th class="num">棚の床面積（m²）</th><th class="num">Aに対する比（%）</th><th class="num">通路${C.moma.aisleTurn}mm込み（m²）</th><th class="num">収納（箱）</th><th class="num">間口数（間口）</th><th class="num">床1m²あたり（箱/m²）</th><th class="num">取り出し段の範囲（mm）</th><th class="num">空箱返却のライン側の置き面（mm）</th></tr></thead>
    <tbody>${rows.map(tr).join('')}</tbody></table></div>
    <h3 style="font-size:14px;margin:18px 0 4px">分かったこと</h3>
    <ul class="note" style="font-size:13px;line-height:1.8">
      <li>人の取り出し域の中だけで奥行きを縮めても、列が増えて床面積はほぼ変わらない（B）。取り出し域の高さが決まっているため、床面積は「箱の総量 ÷ 取り出し域の高さ」でほぼ決まる。</li>
      <li>床を減らせるのは、取り出し域の外（足元）を在庫に使ったときだけ（本案）。</li>
      <li>手を入れる空き（${P.gap.pick[0]}mm・仮）を取ると、取り出し段は3段が上限。以前の画面の「49%」は、この空きを見込まず4段としていた誤りで、正しくは上の表の値。</li>
      <li>空箱返却段はどの案でも取り出し段の上に来て、ライン側の置き面が高い。次の検討課題。</li></ul>`;
}

/* ===================== 3D表示と再生 ===================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, labelLayer);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffffff');
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight('#ffffff', '#dfe6ec', 0.72));
const sun = new THREE.DirectionalLight('#ffffff', 0.72); sun.position.set(3, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 }); sun.shadow.bias = -0.0006; scene.add(sun);
const fillL = new THREE.DirectionalLight('#ffffff', 0.28); fillL.position.set(-4, 3, -4); scene.add(fillL);
const orbit = new Orbit(cam, renderer.domElement);
let cur = 0, plan = null, tline = null, playing = true, speed = 1, endWait = 0, cmpMode = false;
function loadPlan(i, fresh) {
  if (ROOT) { scene.remove(ROOT); ROOT.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  LABELS.forEach(l => l.el.remove()); LABELS = []; DIMS = [];
  if (fresh) WARN = new Set();
  ROOT = new THREE.Group(); scene.add(ROOT);
  plan = PLANS[i].build(ROOT); tline = new Timeline(plan.steps); endWait = 0;
  const p = plan.center; sun.position.set(p.x + 3, 7, p.z + 4); sun.target.position.copy(p); sun.target.updateMatrixWorld();
  applyDimVis();
  if (fresh) { renderPanel(PLANS[i]); setView('side'); }
  setCaption(0, 0, playing ? '' : '「▶ 再生」でMoMaの投入動作を表示します');
}
function setView(v) {
  const t = plan.center, f = plan.span * (cam.aspect < 1 ? 1.7 : cam.aspect < 1.3 ? 1.25 : 1);
  const off = { side: V3(6.0 * f, 2.7, 1.3 * f), aisle: V3(2.0 * f, 2.4, 5.8 * f), line: V3(-2.0 * f, 1.9, -5.4 * f), top: V3(0.01, 8.0 * f, 1.0) }[v];
  orbit.set(t.clone().add(off), t);
}
function applyDimVis() { const on = $('#chkDim').checked; DIMS.forEach(d => d.visible = on); }
function setPlay(p) { playing = p; $('#btnPlay').textContent = p ? '■ 停止' : '▶ 再生'; }
function resize() { const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return; renderer.setSize(r.width, r.height); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
function selectTab(i) {
  document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === i)));
  cmpMode = i === PLANS.length;
  stage.hidden = panel.hidden = cmpMode; compare.hidden = !cmpMode;
  if (cmpMode) { renderCompare(); return; }
  cur = i; resize(); loadPlan(i, true);
  try { history.replaceState(null, '', '#' + PLANS[i].id); } catch (e) { }
}
const tabs = $('#tabs');
[...PLANS.map(P => P.tab), '床面積の比較'].forEach((t, i) => { const b = document.createElement('button'); b.className = 'tab' + (i === PLANS.length ? ' cmp' : ''); b.textContent = t; b.setAttribute('role', 'tab'); b.onclick = () => selectTab(i); tabs.appendChild(b); });
$('#btnPlay').onclick = () => { setPlay(!playing); if (playing && tline.done) loadPlan(cur, false); };
$('#btnRestart').onclick = () => { loadPlan(cur, false); };
$('#selSpeed').onchange = e => speed = +e.target.value;
$('#chkDim').onchange = applyDimVis;
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  if (cmpMode || !plan) return;
  if (playing) {
    if (!tline.done) tline.update(dt * speed);
    else { endWait += dt * speed; if (endWait > 1.6) loadPlan(cur, false); }
  }
  renderer.render(scene, cam);
  const r = renderer.domElement; updateLabels(cam, r.clientWidth, r.clientHeight);
}
const start = Math.max(0, PLANS.findIndex(P => '#' + P.id === location.hash));
selectTab(location.hash === '#compare' ? PLANS.length : start);
if (location.hash === '#compare') { cur = 0; }
frame();
window.__app = { PLANS, loadPlan, selectTab, get tline() { return tline; }, get warns() { return [...WARN]; }, setPlay, setView };
</script>
